name: Wikipedia text (fact check)
on:
  workflow_dispatch:
    inputs:
      out: { description: "保存先フォルダ", required: true }
      pages: { description: "ja:記事名;en:Title を ; 区切りで", required: true }
permissions:
  contents: write
jobs:
  text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests && OUT="${{ inputs.out }}" PAGES="${{ inputs.pages }}" python tools/wiki_text.py
      - run: |
          git config user.name "bungo-bot"; git config user.email "bot@users.noreply.github.com"
          git add "${{ inputs.out }}" && git commit -q -m "wiki text: ${{ inputs.out }}" || exit 0
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && break; sleep 6; done
