name: YouTube playlist (trivia)
on:
  workflow_dispatch:
    inputs:
      title: { description: "再生リストの名前", default: "脳がとける雑学 ショート" }
      match: { description: "タイトルにこの文字がある動画を入れる", default: "#雑学" }
permissions:
  contents: write
jobs:
  playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q google-api-python-client google-auth
      - env:
          YT_CLIENT_ID:     ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          TOKEN:            ${{ secrets.YT_REFRESH_TOKEN }}
          PL_TITLE:         ${{ inputs.title }}
          PL_MATCH:         ${{ inputs.match }}
          PL_DESC: |
            ずんだもんが、名前がひどい生き物・植物・湖・駅などの雑学を紹介するショートのまとめです。
            音声: VOICEVOX:ずんだもん
        run: |
          mkdir -p state && python tools/yt_playlist.py 2>&1 | tee state/yt_playlist_log.txt
          git config user.name "bungo-bot"; git config user.email "bot@users.noreply.github.com"
          git add state/yt_playlist_log.txt && git commit -q -m "yt playlist" && git pull -q --rebase && git push -q || true
