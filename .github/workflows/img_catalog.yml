name: Image catalog (NAZO)
on:
  workflow_dispatch:
    inputs:
      only: { description: "題材ID", required: true }
      category: { description: "Commonsのカテゴリ名（; 区切りで複数可）", default: "" }
      pages: { description: "関連記事 例 en:Cicero;en:Archimedes", default: "" }
      suffix: { description: "保存先の接尾辞（追加分は _2 など）", default: "" }
      search: { description: "Commonsの画像検索の語（; 区切り）", default: "" }
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests && ONLY="${{ inputs.only }}" CATEGORY="${{ inputs.category }}" PAGES="${{ inputs.pages }}" SUFFIX="${{ inputs.suffix }}" SEARCH="${{ inputs.search }}" python tools/img_catalog.py
      - run: |
          git config user.name "bungo-bot"; git config user.email "bot@users.noreply.github.com"
          git add nazo/img_catalog && git commit -q -m "img catalog: ${{ inputs.only }}" || exit 0
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && break; sleep 6; done
