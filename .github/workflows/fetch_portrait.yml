name: Fetch portrait (channel art)
on:
  workflow_dispatch:
    inputs:
      key: { description: "保存名（例 dazai）", required: true }
      category: { description: "Commonsのカテゴリ（例 Category:Osamu Dazai）", required: true }
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests && python tools/fetch_portrait.py "${{ inputs.key }}" "${{ inputs.category }}"
      - run: |
          git config user.name "bungo-bot"; git config user.email "bot@users.noreply.github.com"
          git add channel/ && git commit -q -m "channel: 肖像写真(PD)を取得 ${{ inputs.key }}" && git pull -q --rebase && git push -q || true
