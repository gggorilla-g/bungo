name: BUNGO video
on:
  schedule:
    - cron: "5 3 * * 2,4,6"   # 火木土 JST 12:05 に制作 → 同日 JST 21:00 に予約公開
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cache VOICEVOX assets
        uses: actions/cache@v4
        with:
          path: vv_assets
          key: vv-assets-0.16.4
      - name: Install deps
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-noto-cjk poppler-utils
          pip install -q -r requirements.txt
          python src/setup_voicevox.py
      - name: Prefetch texts for stock (no LLM)
        continue-on-error: true
        run: |
          python src/prefetch.py 2>&1 | tee state/prefetch_log.txt
          exit ${PIPESTATUS[0]}
      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID:     ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          ALLOW_API: ${{ vars.ALLOW_API }}
        run: |
          python src/main.py 2>&1 | tee state/last_run_log.txt
          exit ${PIPESTATUS[0]}
      - name: Commit state back
        if: always()   # 失敗時も記録を残す（失敗が続くとコミットが途絶え、60日でスケジュールが止まるため）
        run: |
          git config user.name "bungo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/ && git diff --cached --quiet || git commit -m "state: $(date -u +%F)" && git push
      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with: { name: video, path: output/*.mp4, retention-days: 7 }
      - name: Upload reel artifact (Instagram用、無ければ何もしない)
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: |
            output/reel.mp4
            output/reel.json
          retention-days: 3
          if-no-files-found: ignore
