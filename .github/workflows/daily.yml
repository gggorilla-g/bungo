name: BUNGO video
on:
  schedule:
    - cron: "5 3 * * 2,4,6"   # 火木土 JST 12:05 に制作 → 同日 JST 21:00 に予約公開
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: state-commit         # NAZO・MACHIGAIと同時にstateを書き戻して衝突しないように
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cache VOICEVOX assets
        uses: actions/cache@v4
        with:
          path: vv_assets
          key: vv-assets-0.16.4
      - name: Install deps
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-noto-cjk fonts-noto-cjk-extra poppler-utils
          pip install -q -r requirements.txt
          python src/setup_voicevox.py
      - name: Prefetch texts for stock (no LLM)
        continue-on-error: true
        run: |
          python src/prefetch.py 2>&1 | tee state/prefetch_log.txt
          exit ${PIPESTATUS[0]}
      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID:     ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          ALLOW_API: ${{ vars.ALLOW_API }}
          # API監査前は自動投稿が非公開に固定されるため、AUTO_UPLOAD変数が1になるまで投稿しない（動画だけ作る）
          NO_UPLOAD: ${{ vars.AUTO_UPLOAD != '1' && '1' || '0' }}
        run: |
          if [ "$NO_UPLOAD" = "1" ]; then export YT_REFRESH_TOKEN=""; echo "投稿なしモード"; fi
          python src/main.py 2>&1 | tee state/last_run_log.txt
          exit ${PIPESTATUS[0]}
      - name: Commit state back
        if: always()   # 失敗時も記録を残す（失敗が続くとコミットが途絶え、60日でスケジュールが止まるため）
        run: |
          git config user.name "bungo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "state: $(date -u +%F)"
          # 制作中に別のコミットが入っても押し出せるよう、取り込み直して最大3回試す
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
      - name: Upload video artifact
        if: always()   # 記録の書き戻しに失敗しても、できた動画は必ず残す
        uses: actions/upload-artifact@v4
        with: { name: video, path: output/*.mp4, retention-days: 7, if-no-files-found: ignore }
      - name: Upload reel artifact (Instagram用、無ければ何もしない)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: |
            output/reel.mp4
            output/reel.json
          retention-days: 3
          if-no-files-found: ignore
