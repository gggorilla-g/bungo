name: 書き出し済みの動画を上げる
# ここで書き出した動画を up-<id> ブランチに置き、それを YouTube に上げる。token は secrets の名前
on:
  workflow_dispatch:
    inputs:
      id: { description: "動画ID（up-<id> ブランチの <id>.mp4）", required: true }
      kit: { description: "投稿キットのパス", required: true }
      token: { description: "YT_REFRESH_TOKEN_MOSO / _KAIDAN / _NAZO", default: "YT_REFRESH_TOKEN_MOSO" }
      publish_at: { description: "公開日時 UTC（空ならすぐ公開）", default: "" }
      lang: { description: "ja / en", default: "ja" }
      no_voice: { description: "声なしの動画なら 1", default: "" }
      kids: { description: "子ども向けなら 1", default: "" }
      thumb: { description: "サムネのパス（リポジトリ内、空ならなし）", default: "" }
permissions:
  contents: write
jobs:
  up:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install -q google-api-python-client google-auth
          git fetch -q origin "up-${{ inputs.id }}"
          B="origin/up-${{ inputs.id }}"; F="${{ inputs.id }}.mp4"
          if git cat-file -e "$B:$F" 2>/dev/null; then git show "$B:$F" > "/tmp/$F"
          else : > "/tmp/$F"; for p in $(git ls-tree --name-only "$B" | grep "^$F.part" | sort); do git show "$B:$p" >> "/tmp/$F"; done; fi   # 100MBを超える動画は分けて置いてある
          ls -la /tmp/*.mp4
      - env:
          PUBLISH_AT: ${{ inputs.publish_at }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets[inputs.token] }}
          VIDEO_LANG: ${{ inputs.lang }}
          NO_VOICE: ${{ inputs.no_voice }}
          MADE_FOR_KIDS: ${{ inputs.kids }}
          THUMB: ${{ inputs.thumb }}
        run: |
          python3 tools/short_upload.py "/tmp/${{ inputs.id }}.mp4" "${{ inputs.kit }}"
          git config user.name "bungo-bot"; git config user.email "bot@users.noreply.github.com"
          git add nazo/manual && git commit -q -m "upload: ${{ inputs.id }}" || exit 0
          for i in 1 2 3; do git pull --rebase --autostash -q && git push -q && break; sleep 5; done
