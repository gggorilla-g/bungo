name: NAZO short
on:
  workflow_dispatch:
    inputs:
      id: { description: "題材ID（nazo/drafts/<id>.json）", required: true }
permissions:
  contents: write
concurrency:
  group: nazo-short
  cancel-in-progress: false
jobs:
  short:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cache VOICEVOX assets
        uses: actions/cache@v4
        with: { path: vv_assets, key: vv-assets-0.16.4 }
      - run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-noto-cjk fonts-noto-cjk-extra poppler-utils
          pip install -q -r requirements.txt
          python src/setup_voicevox.py
          ID="${{ inputs.id }}" python nazo/short.py
      - run: |
          git config user.name "bungo-bot"; git config user.email "bot@users.noreply.github.com"
          git add nazo/manual && git commit -q -m "NAZO: ショート ${{ inputs.id }}" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - uses: actions/upload-artifact@v4
        with: { name: "short-${{ inputs.id }}", path: output/short_*.mp4, retention-days: 7 }
