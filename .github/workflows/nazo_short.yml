name: NAZO short
on:
  workflow_dispatch:
    inputs:
      id: { description: "題材ID（nazo/drafts/<id>.json）／Ver.2は nazo/shorts/<id>.json", required: true }
      script: { description: "nazo/short.py（従来）か nazo/short2.py（Ver.2：A・B 2本）", default: "nazo/short.py" }
permissions:
  contents: write
concurrency:
  group: nazo-short
  cancel-in-progress: false
jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 45     # apt が固まったときに延々と待たない
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cache VOICEVOX assets
        uses: actions/cache@v4
        with: { path: vv_assets, key: vv-assets-0.16.4 }
      - env:
          ASSET_KEY: ${{ secrets.ASSET_KEY }}   # 音源は再配布できないので、暗号化してリポジトリに置き、制作時だけ復号する
        run: |
          for i in 1 2 3; do   # apt が固まることがあるので、時間を切って3回まで試す
            timeout 300 sudo apt-get update -q && timeout 600 sudo apt-get install -y -q ffmpeg fonts-noto-cjk fonts-noto-cjk-extra poppler-utils && break
            sleep 10
          done
          pip install -q -r requirements.txt
          python src/setup_voicevox.py
          case "${{ inputs.script }}" in nazo/short.py|nazo/short2.py|nazo/short3.py) ;; *) exit 1;; esac
          if [ -n "$ASSET_KEY" ]; then for f in assets/enc/*.enc; do [ -e "$f" ] && openssl enc -d -aes-256-cbc -pbkdf2 -in "$f" -out "${f%.enc}" -pass env:ASSET_KEY; done; for t in assets/enc/*.tar; do [ -e "$t" ] && tar xf "$t" -C assets/enc; done; fi
          ID="${{ inputs.id }}" python "${{ inputs.script }}"
      - run: |
          git config user.name "bungo-bot"; git config user.email "bot@users.noreply.github.com"
          git add nazo/manual && git commit -q -m "NAZO: ショート ${{ inputs.id }}" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - uses: actions/upload-artifact@v4
        with: { name: "short-${{ inputs.id }}", path: output/short*.mp4, retention-days: 7 }
