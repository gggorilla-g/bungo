name: BUNGO instagram
# 本編(BUNGO video)とは別ワークフロー。本編が作ったリール素材を拾って投稿するだけ。
# ここが失敗しても本編のYouTube投稿には影響しない。
on:
  schedule:
    - cron: "17 12 * * 2,4,6"   # 火木土 JST 21:17（本編の公開21:00の後）
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency: { group: instagram, cancel-in-progress: false }
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch latest reel from BUNGO video
        id: fetch
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          RUN=$(gh run list --workflow daily.yml --status success --limit 1 \
                --created ">=$(date -u -d '-1 day' +%F)" --json databaseId -q '.[0].databaseId')
          if [ -z "$RUN" ]; then echo "本日の本編なし。何もしない"; exit 0; fi
          gh run download "$RUN" -n reel -D reel || { echo "リール素材なし。何もしない"; exit 0; }
          echo "found=1" >> "$GITHUB_OUTPUT"
      - name: Post to Instagram
        if: steps.fetch.outputs.found == '1'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN:   ${{ secrets.IG_TOKEN }}
        run: |
          pip install -q requests
          python src/ig_post.py reel
      - name: Commit state back
        if: always()
        run: |
          git config user.name "bungo-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull -q --rebase || true
          git add state/ig_posted.json 2>/dev/null; git diff --cached --quiet || git commit -m "ig state: $(date -u +%F)" && git push
