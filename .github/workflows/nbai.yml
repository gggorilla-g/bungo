name: N倍ショート（自動・毎日）
# 予約表 nazo/shorts/nbai/queue.json から「今日（JST）公開」の1本を取り、照合 → 書き出し → 妄想科学に予約公開（API）。
# 予約表の channel: moso（妄想科学、既定）/ miw（Make It Work 3D、英語。鍵は旧百物語の YT_REFRESH_TOKEN_KAIDAN）。在庫が無い日は何もしない。予約表で dry_run: true の回は上げずに書き出しだけ（試運転用）。照合で NG なら上げない。手動実行では id と publish_at を指定できる（dry_run で上げずに書き出しだけ）。
on:
  schedule:
    - cron: "40 */3 * * *"  # 3時間ごと。公開まで36時間以内の未投稿を1本ずつ作って予約（1日に何本でも回せる）
  workflow_dispatch:
    inputs:
      id: { description: "台本ID（空なら予約表の今日の分）", default: "" }
      publish_at: { description: "公開日時 UTC（id を指定したとき）", default: "" }
      dry_run: { description: "true なら上げない（書き出しだけ。動画は nbai-out-<id> ブランチ）", default: "false" }
      channel: { description: "moso（妄想科学）/ miw（Make It Work 3D）", default: "moso" }
permissions:
  contents: write
# 同時に何本でも走らせる（concurrency を付けると待ちの回が1本に間引かれて取り消される）
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -q numpy  # nbai.py は先頭で numpy を読むので、pick（next）の前に入れる
      - id: pick
        run: |
          if [ -n "${{ inputs.id }}" ]; then
            echo "id=${{ inputs.id }}" >> $GITHUB_OUTPUT; echo "at=${{ inputs.publish_at }}" >> $GITHUB_OUTPUT; echo "ch=${{ inputs.channel }}" >> $GITHUB_OUTPUT
          else
            E=$(python3 nazo/nbai.py next)
            if [ -z "$E" ]; then echo "::notice::今日の在庫なし"; echo "id=" >> $GITHUB_OUTPUT; exit 0; fi
            echo "id=$(echo "$E" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')" >> $GITHUB_OUTPUT
            echo "at=$(echo "$E" | python3 -c 'import json,sys;print(json.load(sys.stdin)["publish_at"])')" >> $GITHUB_OUTPUT
            echo "dry=$(echo "$E" | python3 -c 'import json,sys;print(str(json.load(sys.stdin).get("dry_run",False)).lower())')" >> $GITHUB_OUTPUT
            echo "ch=$(echo "$E" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("channel","moso"))')" >> $GITHUB_OUTPUT
          fi
      - if: steps.pick.outputs.id != ''
        run: |
          for i in 1 2 3; do timeout 300 sudo apt-get update -q && timeout 600 sudo apt-get install -y -q ffmpeg && break; sleep 10; done
          pip install -q numpy google-api-python-client google-auth
          cd nazo/kaizo && npm install -q --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - if: steps.pick.outputs.id != ''
        env: { NODE_PATH: "${{ github.workspace }}/nazo/kaizo/node_modules", JOBS: "4" }
        run: |
          python3 nazo/nbai.py build "${{ steps.pick.outputs.id }}" 2> >(tee err.txt >&2) || { tail -n 6 err.txt | sed "s/^/::error::/"; exit 1; }
      - if: steps.pick.outputs.id != '' && (inputs.dry_run == 'true' || steps.pick.outputs.dry == 'true')
        run: |
          N="${{ steps.pick.outputs.id }}"; mkdir -p ../out && cp "output/$N.mp4" nazo/manual/nbai/${N}_upload.txt ../out/
          cd ../out && git init -q && git add . && git -c user.name=bungo-bot -c user.email=bot@users.noreply.github.com commit -q -m "nbai $N" \
            && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/nbai-out-$N
          cd "$GITHUB_WORKSPACE" && D=$(echo "${{ steps.pick.outputs.at }}" | cut -c1-10) && echo done > "nazo/manual/nbai/dry_${N}_${D}.txt"
          git config user.name "bungo-bot"; git config user.email "bot@users.noreply.github.com"
          git add nazo/manual/nbai && git commit -q -m "nbai dry run: $N" && for i in 1 2 3; do git pull --rebase --autostash -q && git push -q && break; sleep 5; done
      - if: steps.pick.outputs.id != '' && inputs.dry_run != 'true' && steps.pick.outputs.dry != 'true'
        env:
          PUBLISH_AT: ${{ steps.pick.outputs.at }}
          NO_VOICE: "1"
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ steps.pick.outputs.ch == 'miw' && secrets.YT_REFRESH_TOKEN_KAIDAN || secrets.YT_REFRESH_TOKEN_MOSO }}
          VIDEO_LANG: ${{ steps.pick.outputs.ch == 'miw' && 'en' || 'ja' }}
        run: |
          N="${{ steps.pick.outputs.id }}"
          T="nazo/manual/nbai/${N}_thumb.jpg"; [ -f "$T" ] && export THUMB="$T"   # サムネがあれば付ける（電話番号の確認済みチャンネルのみ有効）
          python3 tools/short_upload.py "output/$N.mp4" "nazo/manual/nbai/${N}_upload.txt" 2> >(tee err.txt >&2) || { tail -n 4 err.txt | sed "s/^/::error::/"; exit 1; }
          git config user.name "bungo-bot"; git config user.email "bot@users.noreply.github.com"
          git add nazo/manual/nbai && git commit -q -m "nbai upload: $N" || exit 0
          for i in 1 2 3; do git pull --rebase --autostash -q && git push -q && break; sleep 5; done
