name: NAZO thumbnail only
on:
  workflow_dispatch:
    inputs:
      id: { description: "題材ID（nazo/drafts/<id>.json）", required: true }
permissions:
  contents: write
jobs:
  thumb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk fonts-noto-cjk-extra
          pip install -q requests pillow
      - run: ID="${{ inputs.id }}" python nazo/thumb_only.py
      - run: |
          git config user.name "bungo-bot"; git config user.email "bot@users.noreply.github.com"
          git add nazo/manual && git commit -q -m "NAZO: サムネ作り直し ${{ inputs.id }}" && git pull -q --rebase && git push -q || true
