name: KAIDAN prep
on:
  workflow_dispatch:
    inputs:
      cmd: { description: "実行するスクリプト（kaidan/ 以下）", default: "kaidan/survey.py" }
      args: { description: "引数", default: "" }
permissions:
  contents: write
jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install -q -r requirements.txt
          case "${{ inputs.cmd }}" in kaidan/*.py) ;; *) echo "kaidan/ 以下のみ"; exit 1;; esac
          mkdir -p kaidan/state
          python "${{ inputs.cmd }}" ${{ inputs.args }} 2>&1 | tee kaidan/state/prep_log.txt
      - run: |
          git config user.name "bungo-bot"; git config user.email "bot@users.noreply.github.com"
          git add kaidan/state && git commit -q -m "kaidan prep: ${{ inputs.cmd }}" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
