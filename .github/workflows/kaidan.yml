name: KAIDAN video
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kaidan
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cache VOICEVOX assets
        uses: actions/cache@v4
        with:
          path: vv_assets
          key: vv-assets-0.16.4
      - name: Install deps
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-noto-cjk fonts-noto-cjk-extra poppler-utils
          pip install -q -r requirements.txt
          python src/setup_voicevox.py
      - name: Run pipeline
        run: |
          python kaidan/main.py 2>&1 | tee kaidan/state/last_run_log.txt
          exit ${PIPESTATUS[0]}
      - name: Commit state back
        if: always()
        run: |
          git config user.name "bungo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add kaidan/state/ kaidan/manual/
          git diff --cached --quiet && exit 0
          git commit -m "kaidan state: $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaidan-video
          path: |
            output/*.mp4
            output/thumb.png
            output/upload.txt
          retention-days: 7
          if-no-files-found: ignore
