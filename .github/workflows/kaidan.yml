name: KAIDAN video
on:
  schedule:
    - cron: "20 3 * * *"     # 毎日 JST 12:20 に制作（在庫が無ければ何もしない）→ 夜の公開に回す
  workflow_dispatch:
    inputs:
      upload: { description: "YouTubeに投稿する", type: boolean, default: false }
permissions:
  contents: write
concurrency:
  group: kaidan
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cache VOICEVOX assets
        uses: actions/cache@v4
        with:
          path: vv_assets
          key: vv-assets-0.16.4
      - name: Install deps
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-noto-cjk fonts-noto-cjk-extra poppler-utils
          pip install -q -r requirements.txt
          python src/setup_voicevox.py
      - name: Run pipeline
        env:
          YT_CLIENT_ID:     ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN_KAIDAN }}
          # 投稿する条件: 手動実行で「投稿する」を選んだとき／定期実行でAUTO_UPLOAD変数が1のとき（API監査の通過後に1にする）
          DO_UPLOAD:        ${{ (inputs.upload == true && '1') || (github.event_name == 'schedule' && vars.AUTO_UPLOAD == '1' && '1') || '0' }}
          PUBLISH_MODE:     ${{ vars.PUBLISH_MODE }}
        run: |
          if [ "$DO_UPLOAD" != "1" ]; then export YT_REFRESH_TOKEN=""; echo "投稿なしモード"; fi
          mkdir -p kaidan/manual output
          python kaidan/main.py 2>&1 | tee kaidan/state/last_run_log.txt
          exit ${PIPESTATUS[0]}
      - name: Commit state back
        if: always()
        run: |
          git config user.name "bungo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A kaidan/state kaidan/manual 2>/dev/null || git add -A kaidan/state
          git diff --cached --quiet && exit 0
          git commit -m "kaidan state: $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaidan-video
          path: |
            output/*.mp4
            output/thumb.png
            output/upload.txt
          retention-days: 90
          if-no-files-found: ignore
