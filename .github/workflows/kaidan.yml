name: KAIDAN video
on:
  schedule:
    - cron: "20 3 * * *"     # 毎日 JST 12:20 に制作（在庫が無ければ何もしない）→ 夜の公開に回す
  workflow_dispatch:
    inputs:
      upload: { description: "YouTubeに投稿する", type: boolean, default: false }
      work_id: { description: "作り直す回の作品ID（例 059429）。指定すると投稿せず、在庫・公開記録も変えない", default: "" }
      retention_days: { description: "成果物の保持日数", default: "30" }
      commit_kit: { description: "作り直しで投稿キット（kaidan/manual/<id>）を書き戻す。公開済みの回は 0（まとめ用に動画だけ作る）", default: "1" }
permissions:
  contents: write
concurrency:
  group: kaidan-${{ inputs.work_id || 'daily' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cache VOICEVOX assets
        uses: actions/cache@v4
        with:
          path: vv_assets
          key: vv-assets-0.16.4
      - name: Install deps
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-noto-cjk fonts-noto-cjk-extra poppler-utils
          pip install -q -r requirements.txt
          python src/setup_voicevox.py
      - name: Run pipeline
        env:
          YT_CLIENT_ID:     ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN_KAIDAN }}
          # 投稿する条件: 手動実行で「投稿する」を選んだとき／定期実行でAUTO_UPLOAD変数が1のとき（API監査の通過後に1にする）
          WORK_ID:          ${{ inputs.work_id }}
          DO_UPLOAD:        ${{ (inputs.work_id == '' && inputs.upload == true && '1') || (github.event_name == 'schedule' && vars.AUTO_UPLOAD == '1' && '1') || '0' }}
          PUBLISH_MODE:     ${{ vars.PUBLISH_MODE }}
        run: |
          if [ "$DO_UPLOAD" != "1" ]; then export YT_REFRESH_TOKEN=""; echo "投稿なしモード"; fi
          mkdir -p kaidan/manual output
          LOG=kaidan/state/last_run_log.txt
          if [ -n "$WORK_ID" ]; then LOG=output/run_log.txt; fi   # 作り直しは状態ファイルに触れない（並行実行でぶつからないように）
          python kaidan/main.py 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          if [ "$rc" != "0" ]; then tail -n 8 "$LOG" | sed "s/^/::error::/"; cat /etc/os-release | grep PRETTY | sed "s/^/::warning::/"; fi   # 失敗の原因を注釈に出す（ログを外から読めないため）
          exit $rc
      - name: Commit state back
        if: always()
        run: |
          git config user.name "bungo-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -n "${{ inputs.work_id }}" ] && [ "${{ inputs.commit_kit }}" = "0" ]; then
            echo "キットは書き戻さない"; exit 0
          elif [ -n "${{ inputs.work_id }}" ]; then
            git add -A "kaidan/manual/${{ inputs.work_id }}"
            msg="kaidan rerender: ${{ inputs.work_id }}"
          else
            git add -A kaidan/state kaidan/manual 2>/dev/null || git add -A kaidan/state
            msg="kaidan state: $(date -u +%F)"
          fi
          git diff --cached --quiet && exit 0
          git commit -m "$msg"
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push && break; sleep $((RANDOM % 15 + 5)); done   # 作り直しを並行で回してもぶつからないように
      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.work_id && format('kaidan-video-{0}', inputs.work_id) || 'kaidan-video' }}
          path: |
            output/*.mp4
            output/thumb.png
            output/upload.txt
          retention-days: ${{ inputs.retention_days || 90 }}
          if-no-files-found: ignore
