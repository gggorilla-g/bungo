name: BUNGO manual kit
on:
  workflow_dispatch:
    inputs:
      run_id:  { description: "動画を作った BUNGO video の実行ID", required: true }
      work_id: { description: "作品ID（例 001567）", required: true }
permissions:
  contents: write
  actions: read
concurrency:
  group: state-commit
  cancel-in-progress: false
jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: video, path: dl, run-id: "${{ inputs.run_id }}", github-token: "${{ github.token }}" }
      - run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-noto-cjk fonts-noto-cjk-extra
          pip install -q -r requirements.txt
          WORK="${{ inputs.work_id }}" VIDEO="dl/${{ inputs.work_id }}.mp4" python tools/bungo_kit.py
      - run: |
          git config user.name "bungo-bot"; git config user.email "bot@users.noreply.github.com"
          git add state/manual && git commit -q -m "BUNGO: 手動投稿キット ${{ inputs.work_id }}"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
