<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
@font-face{font-family:"JumpSans";font-weight:400;src:url(fonts_jp/NotoSansCJKjp-Regular.woff2) format("woff2")}
@font-face{font-family:"JumpSans";font-weight:700;src:url(fonts_jp/NotoSansCJKjp-Bold.woff2) format("woff2")}
@font-face{font-family:"JumpSans";font-weight:900;src:url(fonts_jp/NotoSansCJKjp-Black.woff2) format("woff2")}
html,body{margin:0;background:#000}
#stage{position:relative;width:540px;height:960px;overflow:hidden}
#stage canvas{position:absolute;left:0;top:0}
#hud{position:absolute;left:0;top:0;width:540px;height:960px;font-family:"JumpSans"}
#hud text{paint-order:stroke;stroke:#101010;stroke-linejoin:round;fill:#fff}
</style></head>
<body><div id="stage"><svg id="hud" viewBox="0 0 540 960" xmlns="http://www.w3.org/2000/svg"></svg></div>
<script src="vendor.js"></script>
<script src="lineup_calc.js"></script>
<script>
// 大きさ比べ：小さい順に左から並べ、カメラが横へ流れながら引いていく。形・並び・字幕はすべて spec のデータから
const getJ=u=>{const x=new XMLHttpRequest();x.open('GET',u,false);x.send();if(x.status!==200)throw new Error('読めない: '+u);return JSON.parse(x.responseText)};
const ID=(new URLSearchParams(location.search).get('spec')||'rockets_ja').replace(/^.*\//,'').replace(/\.json$/,'');
const SPEC=getJ('specs/'+ID+'.json'),C=LINEUP.make(SPEC),IT=C.items,W=(SPEC.output.width||1080)/2,H=(SPEC.output.height||1920)/2,LAND=W>H,U=Math.min(W,H)/540,CX=W/2,FOV=30,TANH=Math.tan(FOV/2*Math.PI/180),ASP=W/H;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x)),lerp=(a,b,k)=>a+(b-a)*k,sstep=(a,b,x)=>{const k=clamp((x-a)/(b-a),0,1);return k*k*(3-2*k)};
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
{const st=document.getElementById('stage');st.style.width=W+'px';st.style.height=H+'px';const hv=document.getElementById('hud');hv.setAttribute('viewBox','0 0 '+W+' '+H);hv.style.width=W+'px';hv.style.height=H+'px'}
renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(W,H);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.getElementById('stage').prepend(renderer.domElement);
function gradTex(stops){const c=document.createElement('canvas');c.width=4;c.height=512;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,512);stops.forEach(([k,col])=>g.addColorStop(k,col));x.fillStyle=g;x.fillRect(0,0,4,512);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const scene=new THREE.Scene();scene.background=gradTex([[0,'#3f86d6'],[.6,'#a9d2f2'],[1,'#e9eef0']]);
const hemi=new THREE.HemisphereLight(0xeaf4ff,0xb9b2a4,1.2);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff4e2,2.4);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0004;scene.add(sun);scene.add(sun.target);
const rim=new THREE.DirectionalLight(0xdff0ff,1.6);scene.add(rim);scene.add(rim.target);   // 後ろからの光で輪郭を縁どる（リムライト）
const S=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:new THREE.Color(c),roughness:.5,metalness:.1},o||{}));
function mesh(g,m,sh=true){const x=new THREE.Mesh(g,m);x.castShadow=sh;x.receiveShadow=true;return x}
// 地面：格子（大きさの手がかり）。格子の間隔はカメラの引きに合わせて切り替える
const GT=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.fillStyle='#d9d6cc';x.fillRect(0,0,256,256);x.strokeStyle='#c4bfb1';x.lineWidth=3;x.strokeRect(0,0,256,256);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t})();
const ground=mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshLambertMaterial({map:GT}),false);ground.rotation.x=-Math.PI/2;scene.add(ground);
// ===== 形 =====
function rocket(s){const g=new THREE.Group();let y=0;const R0=s.stages[0].d/2;
  for(const st of s.stages){const r0=st.d/2,r1=st.d1!=null?st.d1/2:r0,pts=[];
    if(st.d1===0){const n=14;for(let i=0;i<=n;i++){const k=i/n;pts.push(new THREE.Vector2(Math.max(.001,r0*Math.pow(Math.cos(k*Math.PI/2),.75)),y+st.h*k))}}
    else{pts.push(new THREE.Vector2(r0,y),new THREE.Vector2(r1,y+st.h))}
    const geo=new THREE.LatheGeometry(pts,48);const m=mesh(geo,S(st.color));g.add(m);
    const band=mesh(new THREE.CylinderGeometry(r0*1.012,r0*1.012,Math.max(.04,st.d*.025),48,1,true),S('#2a2a2a'),false);band.position.y=y;if(y>0)g.add(band);
    y+=st.h}
  const nb=Math.max(1,Math.round(R0*1.4));for(let i=0;i<nb;i++){const a=i/nb*Math.PI*2,rr=nb>1?R0*.45:0;const b=mesh(new THREE.CylinderGeometry(R0*.16,R0*.3,R0*.5,16,1,true),S('#3a3a3a',{metalness:.6,side:THREE.DoubleSide}));
    b.position.set(Math.cos(a)*rr,-R0*.12,Math.sin(a)*rr);g.add(b)}
  if(s.boosters){const B=s.boosters,off=R0+B.d/2,angs=B.n===2?[0,Math.PI]:B.n===4?[0,Math.PI/2,Math.PI,Math.PI*1.5]:[...Array(B.n)].map((_,i)=>i/B.n*Math.PI*2);
    for(const a of angs){const bg=new THREE.Group();const hb=B.h*.86,c=mesh(new THREE.CylinderGeometry(B.d/2,B.d/2,hb,24),S(B.color||'#f2f2ee'));c.position.y=hb/2;bg.add(c);
      const pts=[];for(let i=0;i<=10;i++){const k=i/10;pts.push(new THREE.Vector2(Math.max(.001,B.d/2*Math.pow(Math.cos(k*Math.PI/2),.75)),hb+B.h*.14*k))}bg.add(mesh(new THREE.LatheGeometry(pts,24),S(B.color||'#f2f2ee')));
      bg.position.set(Math.cos(a)*off,0,Math.sin(a)*off);g.add(bg)}}
  return g}
function person(s){const g=new THREE.Group(),h=s.h||1.7,k=h/1.7;const legs=mesh(new THREE.BoxGeometry(.32*k,.8*k,.2*k),S('#3d4450'));legs.position.y=.4*k;g.add(legs);
  const body=mesh(new THREE.BoxGeometry(.44*k,.62*k,.24*k),S('#ff8a3d'));body.position.y=1.11*k;g.add(body);
  const head=mesh(new THREE.SphereGeometry(.13*k,20,14),S('#f1d2b8'));head.position.y=1.57*k;g.add(head);return g}
// 塔・ビル：四角すい台（または円すい台）を積む。glass は階の帯（窓）を描く
const WT=(()=>{const c=document.createElement('canvas');c.width=64;c.height=64;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,64,64);x.fillStyle='#b9c3cc';x.fillRect(0,40,64,10);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;return t})();
function tower(s){const g=new THREE.Group();let y=0;
  for(const q of s.tiers){const w1=q.w1!=null?q.w1:q.w,seg=q.round?32:4,k=q.round?.5:Math.SQRT1_2;
    const geo=q.ball?new THREE.SphereGeometry(q.w/2,32,20).scale(1,q.h/q.w,1):new THREE.CylinderGeometry(Math.max(.01,w1*k),q.w*k,q.h,seg,1);let mat;
    if(q.glass){const t=WT.clone();t.needsUpdate=true;t.repeat.set(seg===4?4:8,Math.max(1,Math.round(q.h/4)));mat=S(q.color||'#8fb3cc',{map:t,metalness:.25,roughness:.35})}else mat=S(q.color||'#cfcfcf');
    const m=mesh(geo,mat);if(!q.round)m.rotation.y=Math.PI/4;m.position.y=y+q.h/2;g.add(m);
    if(q.span){const a=mesh(new THREE.BoxGeometry(q.span,q.spanH||q.w*.25,q.w*.35),S(q.color||'#cfcfcf'));a.position.y=y+q.h-(q.spanH||q.w*.25)/2-(q.spanDrop||0);g.add(a)}
    y+=q.h}
  return g}
function sphere(s){const g=new THREE.Group();const m=mesh(new THREE.SphereGeometry(s.d/2,64,40),S(s.color||'#888',{roughness:.8,metalness:0}));m.position.y=s.d/2;g.add(m);
  if(s.ring){const r=mesh(new THREE.RingGeometry(s.d*.62,s.d*1.15,96),S(s.ringColor||'#d8c9a0',{side:THREE.DoubleSide,roughness:.9}),false);r.rotation.x=-Math.PI/2+.28;r.position.y=s.d/2;g.add(r)}
  if(s.bands){const c=document.createElement('canvas');c.width=8;c.height=256;const x=c.getContext('2d');s.bands.forEach((b,i)=>{x.fillStyle=b;x.fillRect(0,i*256/s.bands.length,8,256/s.bands.length+1)});const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;m.material.map=t;m.material.color.set('#ffffff')}
  return g}
if(SPEC.space){scene.background=new THREE.Color('#05070d');ground.visible=false;sun.castShadow=false}
IT.forEach(it=>{const o=it.shape.type==='rocket'?rocket(it.shape):it.shape.type==='sphere'?sphere(it.shape):it.shape.type==='tower'?tower(it.shape):person(it.shape);o.position.x=it.x;o.rotation.y=.35;scene.add(o);it.obj=o});
// いまの物の高さを示す横線
const LINE=mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshBasicMaterial({color:0xffd43b,transparent:true,opacity:.0,depthWrite:false}),false);scene.add(LINE);
const cam=new THREE.PerspectiveCamera(FOV,ASP,.05,20000);
// ===== HUD =====
const NS='http://www.w3.org/2000/svg',hud=document.getElementById('hud');
function el(tag,a,txt){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;hud.appendChild(e);return e}
const tw=(s,size)=>{let w=0;for(const ch of String(s))w+=ch.charCodeAt(0)<256?.58:1;return w*size};
function T(x,y,size,txt,o={}){const a={x,y,'font-size':size,'font-weight':o.w||900,'text-anchor':o.a||'middle','stroke-width':o.sw!=null?o.sw:Math.max(3,size*.2)};let st='';if(o.fill)st+='fill:'+o.fill+';';if(o.op!=null)st+='opacity:'+o.op+';';if(st)a.style=st;return el('text',a,txt)}
function drawHud(t,f,vh){hud.innerHTML='';
  if(LAND)T(W*.025,H*.07,24*U,C.L(SPEC.title),{sw:6*U,a:'start'});else{const ts=Math.min(30*U,W*.92/tw(C.L(SPEC.title),1));T(CX,H*.096,ts,C.L(SPEC.title),{sw:ts*.23})}
  // 物の上のラベル（見せ終わった物だけ。小さすぎる物は出さない）
  const showN=f.out!=null?C.N:f.i+1,boxes=[];   // ラベルが重なったら上へずらす
  const TOPLIM=H*(LAND?.1:.125);for(let i=showN-1;i>=0;i--){if(f.out==null?i<f.i-3:(LAND&&i<C.N-6&&i%2))continue;const it=IT[i],p=new THREE.Vector3(it.x,it.h,0).project(cam),q=new THREE.Vector3(it.x,0,0).project(cam);const ph=(p.y-q.y)/2*H;if(ph<26*U)continue;
    const x=(p.x+1)/2*W;let y=(1-p.y)/2*H;if(x<-60||x>W+60)continue;const big=i===f.i&&f.out==null,sz=(big?24:clamp(ph/8,13,19))*U;
    const op=i===f.i||f.out!=null?1:.85;const nm=C.nameText(it).replace(/（.*?）|\(.*?\)/g,'');const vt=C.valueText(it).replace(/ \(.*\)$/,'');
    const bw=Math.max(tw(nm,sz),tw(vt,sz*1.08))+8,bh=sz*2.5;let yy=y,ok=false;for(let k=0;k<6;k++){const hit=boxes.find(b=>Math.abs(b.x-x)<(b.w+bw)/2+2*U&&Math.abs(b.y-yy)<bh);if(!hit){ok=true;break}yy=hit.y-bh}if(!ok||yy-8-sz*2.4<TOPLIM)continue;boxes.push({x,y:yy,w:bw});y=yy;
    if(!(f.out!=null&&ph<70*U))T(x,y-8-sz*1.25,sz,nm,{w:700,sw:sz*.24,op});T(x,y-8,sz*1.08,C.valueText(it).replace(/ \(.*\)$/,''),{sw:sz*.26,fill:'#ffd43b',op})}
  const c=C.captionAt(t),a=f.out!=null?1:clamp((t-(t<C.IN?0:IT[f.i].t0))/.12,0,1);
  const y1=H*(LAND?(c.c2?.80:.84):(c.c2?.754:.775)),s1=Math.min(44*U,W*.87/tw(c.c1,1));T(CX,y1+(1-a)*5,s1,c.c1,{sw:s1*.22,op:(.3+.7*a).toFixed(2)});
  if(c.c2){const s2=Math.min(64*U,W*.87/tw(c.c2,1));T(CX,y1+s2+8+(1-a)*5,s2,c.c2,{sw:s2*.2,fill:'#ffd43b',op:(.3+.7*a).toFixed(2)})}
  T(CX,H*.98,11*U,C.L(SPEC.notes),{w:400,sw:3*U,op:.85})}
// ===== 1コマ =====
const VH=it=>SPEC.space?Math.max(it.h*(LAND?2.6:1.75),it.w/ASP*1.9):Math.max(4.2,it.h*(LAND?2.5:2.1)),SHIFT=it=>it===IT[0]?0:VH(it)*ASP*(SPEC.space?.17:LAND?.24:.16);   // 注目の物は少し右寄せ（左に見せ終わった物、右の次の物は隠れ気味）
const hmax=Math.max(...IT.map(i=>i.h)),xl=IT[0].x-IT[0].w,xr=IT[C.N-1].x+IT[C.N-1].w;
const OV={x:(xl+xr)/2,vh:Math.max(hmax*(LAND?2.9:2.0),(xr-xl)/ASP*(LAND?1.06:1.3))};
window.renderAt=function(t){
  const f=C.focusAt(t),it=IT[f.i],pv=IT[Math.max(0,f.i-1)],e=f.k*f.k*(3-2*f.k);
  let X=lerp(pv.x+SHIFT(pv)*-1,it.x-SHIFT(it),e),Vh=Math.exp(lerp(Math.log(VH(pv)),Math.log(VH(it)),e));
  if(t<C.IN){X=IT[0].x;Vh=VH(IT[0])}else if(f.i===0){X=IT[0].x}
  if(f.out!=null){const o=sstep(0,1,f.out);X=lerp(it.x-SHIFT(it),OV.x,o);Vh=Math.exp(lerp(Math.log(VH(it)),Math.log(OV.vh),o))}
  const d=Vh/(2*TANH),az=(14+6*Math.sin(t*.12))*Math.PI/180,yt=Vh*.16,el=4*Math.PI/180;
  cam.position.set(X+Math.sin(az)*d,yt+Math.sin(el)*d,Math.cos(az)*d);cam.lookAt(X,yt,0);cam.far=d*6;cam.near=d/200;cam.updateProjectionMatrix();
  // 地面と格子
  const span=d*8;ground.scale.set(span,span,1);ground.position.set(X,0,0);const cell=Math.pow(10,Math.round(Math.log10(Vh/6)));GT.repeat.set(span/cell,span/cell);GT.offset.set((X-span/2)/cell%1,0);
  // 影の範囲をカメラに合わせる
  const sc=sun.shadow.camera;sc.left=-Vh*1.2;sc.right=Vh*1.2;sc.top=Vh*1.2;sc.bottom=-Vh*1.2;sc.near=1;sc.far=Vh*8;sc.updateProjectionMatrix();
  sun.position.set(X+Vh*.8,Vh*2.2,Vh*1.4);sun.target.position.set(X,0,0);rim.position.set(X-Vh,Vh,-Vh*1.5);rim.target.position.set(X,Vh*.3,0);
  // 高さの横線（いまの物の頂上から左へ）
  const lo=f.out!=null?0:(t<C.IN?0:sstep(it.t0+.25,it.t0+.6,t));LINE.material.opacity=.75*lo;LINE.visible=lo>.01;
  const lw=Vh*ASP*.9;LINE.scale.set(lw,Vh*.0035,Vh*.0035);LINE.position.set(it.x-lw/2+it.w*.6,it.h,0);
  renderer.render(scene,cam);drawHud(t,f,Vh);return{t}};
window.__info={total:C.DUR};
Promise.all([400,700,900].map(w=>document.fonts.load(w+' 20px JumpSans','あ0'))).then(()=>{window.__fig={kind:'none'};window.__ready=true});
</script></body></html>
