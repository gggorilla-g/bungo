  if(s.type==='contact')return s.crouch?lg(Fn(s.n),FCLOSE,smoother(clamp(u/(s.dur*.85),0,1))):Fn(s.n);
  const from=s.n===HERO?FCLOSE:Fn(s.n-1),to=Fn(s.n),T=s.T||Math.max(.5,.58*airN(s.n)/s.speed),sched=lg(from,to,smoother(clamp(u/T,0,1)));
