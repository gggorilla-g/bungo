// もしもショート「腕の長さが1秒ごとに2倍」。道路を走る人が、歩く人→自転車→車→新幹線→旅客機→音速（衝撃波）→ライフル弾を追いこし、地球を回り、飛び出す
const getJ=u=>{const x=new XMLHttpRequest();x.open('GET',u,false);x.send();if(x.status!==200)throw new Error('読めない: '+u);return JSON.parse(x.responseText)};
const ID=(new URLSearchParams(location.search).get('spec')||'arm_ja').replace(/^.*\//,'').replace(/\.json$/,'');

    const e=mesh(new THREE.CylinderGeometry(.8,.7,3.6,20),gr);e.rotation.z=Math.PI/2;e.position.set(4.6,-1.4,s*6);g.add(e)}
  const fin=new THREE.Shape();fin.moveTo(0,0);fin.lineTo(-3.5,6.5);fin.lineTo(-6,6.5);fin.lineTo(-6.5,0);fin.closePath();const fm=mesh(new THREE.ExtrudeGeometry(fin,{depth:.3,bevelEnabled:false}),b);fm.position.set(-11.5,1.2,-.15);g.add(fm);
  const hs=new THREE.Shape();hs.moveTo(0,0);hs.lineTo(-2.4,6);hs.lineTo(-4,6);hs.lineTo(-4.4,0);hs.closePath();for(const s of[1,-1]){const m=mesh(new THREE.ExtrudeGeometry(hs,{depth:.2,bevelEnabled:false}),w);m.rotation.x=s*Math.PI/2;m.position.set(-13.5,.8,0);g.add(m)}
  const ln=mesh(new THREE.BoxGeometry(30,.25,4.05),b);ln.position.set(2,-.2,0);g.add(ln);return g})();CITY.add(PLANE);

const SPACEFX=f=>f==='a18'||f==='a20'||f==='a29'||f==='end';

// 東京タワー風（333m、赤白の格子塔）
const TOWER=(()=>{const g=new THREE.Group(),lat=c=>canvasTex(128,256,(x,w,h)=>{x.fillStyle='rgba(0,0,0,0)';x.clearRect(0,0,w,h);x.strokeStyle=c;x.lineWidth=7;x.strokeRect(0,0,w,h);for(let i=-4;i<8;i++){x.beginPath();x.moveTo(0,i*48);x.lineTo(w,i*48+96);x.stroke();x.beginPath();x.moveTo(w,i*48);x.lineTo(0,i*48+96);x.stroke()}});
  const red=lat('#e2481f'),white=lat('#f2f2ee');const seg=[[0,80,40,22],[80,150,22,12],[150,230,12,6],[230,300,6,2.5],[300,333,2.5,.6]];
  seg.forEach(([y0,y1,r0,r1],i)=>{for(let j=0;j<4;j++){const a=y0+(y1-y0)*j/4,b=y0+(y1-y0)*(j+1)/4,ra=lerp(r0,r1,j/4),rb=lerp(r0,r1,(j+1)/4);const m=mesh(new THREE.CylinderGeometry(rb,ra,b-a,4,1,true),new THREE.MeshStandardMaterial({map:(i*4+j)%2?white:red,transparent:true,alphaTest:.3,side:THREE.DoubleSide,roughness:.6}));m.rotation.y=Math.PI/4;m.position.y=(a+b)/2;g.add(m)}});
  for(const[y,r]of[[145,15],[223,8]]){const d=mesh(new THREE.CylinderGeometry(r,r,8,8),STD(0xdedfe2));d.position.y=y;g.add(d)}g.position.set(-80,0,LANE-40);return g})();CITY.add(TOWER);

  const body=mesh(new THREE.CylinderGeometry(8,36,500,24,1),STD(0xffffff,{map:lat,roughness:.5}));body.position.y=250;g.add(body);

{const lat=36*Math.PI/180,lon=139*Math.PI/180,u=(lon+Math.PI)/(2*Math.PI),v=(Math.PI/2-lat)/Math.PI,vx=new THREE.Vector3(-Math.cos(u*2*Math.PI)*Math.sin(v*Math.PI),Math.cos(v*Math.PI),Math.sin(u*2*Math.PI)*Math.sin(v*Math.PI));earth.quaternion.setFromUnitVectors(vx,new THREE.Vector3(0,1,0))}
