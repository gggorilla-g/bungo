<script>

 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));STARS.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xe6ecf5,size:1.8,sizeAttenuation:false})))}

const metal=S(0x8c939b,{metalness:.75,roughness:.32});
{const g=part('plates');for(const y of[.22,1.16]){const b=mesh(new THREE.CylinderGeometry(.418,.418,.07,64),metal);b.position.y=y;g.add(b);
   for(let i=0;i<12;i++){const a=i*Math.PI/6,rv=mesh(new THREE.SphereGeometry(.016,8,6),metal);rv.position.set(Math.cos(a)*.42,y,Math.sin(a)*.42);g.add(rv)}}
 const nb=mesh(new THREE.CylinderGeometry(.16,.16,.08,32),metal);nb.position.y=1.95;g.add(nb)}

 const bell=mesh(new THREE.CylinderGeometry(.14,.3,.42,32,1,true),S(0x3c3f43,{metalness:.7,side:THREE.DoubleSide}));bell.position.y=-.33;g.add(bell);
 for(let i=0;i<4;i++){const a=Math.PI/4+i*Math.PI/2,leg=box(.04,.62,.04,m);leg.position.set(Math.cos(a)*.36,-.31,Math.sin(a)*.36);leg.rotation.set(Math.sin(a)*.12,0,-Math.cos(a)*.12);g.add(leg)}}
{const g=part('fins'),m=S(0xd8402c,{roughness:.4});const sh=new THREE.Shape();sh.moveTo(0,0);sh.lineTo(.4,-.45);sh.lineTo(.4,-.62);sh.lineTo(0,-.42);sh.lineTo(0,.5);sh.lineTo(0,0);

{const g=part('foil');const f=mesh(new THREE.CylinderGeometry(.41,.41,.64,64,1,true),goldMat);f.position.y=.72;g.add(f)}
{const g=part('oxygen');const m=S(0xeef2f5,{metalness:.25,roughness:.3}),cap=S(0x2f9e5b);for(const z of[-.14,.14]){const c=mesh(new THREE.CylinderGeometry(.085,.085,.8,20),m);c.position.set(-.5,.75,z);g.add(c);
  const k=mesh(new THREE.SphereGeometry(.085,16,10,0,Math.PI*2,0,Math.PI/2),cap);k.position.set(-.5,1.15,z);g.add(k)}
 const st=box(.12,.06,.4,metal);st.position.set(-.44,.5,0);g.add(st)}
const PUFF=[];{const g=part('thrusters'),m=S(0x55595e,{metalness:.6});for(let i=0;i<4;i++){const a=i*Math.PI/2,x=Math.cos(a)*.36,z=Math.sin(a)*.36;const t=box(.09,.09,.09,m);t.position.set(x,1.5,z);t.rotation.y=-a;g.add(t);
  const pf=mesh(new THREE.SphereGeometry(.06,10,8),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0}),false);g.add(pf);PUFF.push({pf,a})}}
const WING=[];{const g=part('solar'),cell=S(0x1d3f8f,{metalness:.4,roughness:.25}),frame=S(0xb8bec4,{metalness:.7});
 for(const s of[1,-1]){const w=new THREE.Group();w.position.set(s*.4,1.0,0);g.add(w);const arm=box(.3,.04,.04,frame);arm.position.set(s*.15,0,0);w.add(arm);
  const pn=box(1.0,.6,.02,cell);pn.position.set(s*.8,0,0);w.add(pn);for(let i=1;i<4;i++){const ln=box(.01,.6,.025,frame);ln.position.set(s*(.3+i*.25),0,0);w.add(ln)}WING.push({w,s})}}
{const g=part('shield');const sh=mesh(new THREE.CylinderGeometry(.5,.46,.08,48),L(0x5b3a26,{flatShading:false}));sh.position.y=-.02;g.add(sh)}

  const hd=mesh(new THREE.ConeGeometry(.07,.14,10),m,false);hd.rotation.z=Math.PI/2;hd.position.x=-.2;a.add(hd);const ang=i*Math.PI/2;a.position.set(Math.cos(ang)*.75,.9,Math.sin(ang)*.75);a.rotation.y=-ang;FR.add(a);ARR.push(a)}}

const NS='http://www.w3.org/2000/svg',hud=document.getElementById('hud'),haze=document.getElementById('haze');
function el(tag,a,txt,parent){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;(parent||hud).appendChild(e);return e}
const tw=(s,size)=>{let w=0;for(const ch of String(s))w+=ch.charCodeAt(0)<256?.58:1;return w*size};

const PARTS=Object.keys(SPEC.parts);

  const l=LINES.find(x=>t>=x.t0-.02&&t<x.t1+.12)||LINES.filter(x=>x.t0<=t).pop();if(!l)return;

  let y=l.cap.length>1?690:712;l.cap.forEach((s,i)=>{const size=Math.min(44,476/tw(s,1));T(270,y+(1-a)*6,size,s,{a:'middle',sw:9,op:(.3+.7*a).toFixed(2)});y+=size+12})}

// ===== 1コマ =====
const popS=(t,t0)=>{const u=(t-t0)/.35;if(u<0)return 0;if(u>=1)return 1;const c=1.70158;return 1+(c+1)*Math.pow(u-1,3)+c*Math.pow(u-1,2)};

window.renderAt=function(t){

  const lift=.66*sstep(addT.engine,addT.engine+.35,t);

  // 問題1：割れやすい（赤い矢印が外からぶつかる）

  const fk=(.85+.15*Math.sin(t*53)+.08*Math.sin(t*31))*big;flame.visible=flameIn.visible=fire;flame.scale.set(fk,fk*(1+.3*Math.sin(t*41)),fk);flame.position.y=-.55-.65*fk;flameIn.scale.copy(flame.scale);flameIn.position.y=-.55-.4*fk;
  // 発射のけむり（地面に広がる）
  SMOKE.forEach(o=>{const u=t-T_LAUNCH-o.d;o.s.visible=!space&&u>0;if(u>0){const r=.6+o.v*u*1.2;o.s.position.set(Math.cos(o.a)*r,.25+u*.25,Math.sin(o.a)*r);o.s.scale.setScalar(.6+u*1.3);o.s.material.opacity=clamp(.85-u*.25,0,.85)}});

  const dk=t>=fxStart('dark')&&t<addT.solar+.6?sstep(fxStart('dark'),fxStart('dark')+.4,t)*(1-sstep(addT.solar+.1,addT.solar+.6,t)):0;
