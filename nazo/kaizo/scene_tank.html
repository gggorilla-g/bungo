{const g=part('turret',PIV);const h=mesh(new THREE.CylinderGeometry(.46,.54,.3,32),olive);h.position.y=.15;g.add(h);const mt=box(.2,.24,.36,olive);mt.position.set(.5,.2,0);g.add(mt);

const GYRO=[];{const g=part('stab',PIV);const b=box(.26,.2,.3,darkM);b.position.set(-.5,.38,0);g.add(b);const t=mesh(new THREE.TorusGeometry(.1,.025,8,24),S(0xf2c230,{metalness:.4}));t.position.set(-.5,.54,0);g.add(t);GYRO.push(t)}
{const g=part('periscope',VAC);const tb=mesh(new THREE.CylinderGeometry(.055,.055,.8,16),steel);tb.position.set(-.3,.5,.55);g.add(tb);
 const hd=box(.22,.16,.16,darkM);hd.position.set(-.27,.94,.55);g.add(hd);const gl=mesh(new THREE.PlaneGeometry(.12,.08),S(0x7fc6ee,{emissive:0x0b2a44,roughness:.05}));gl.position.set(-.155,.94,.55);gl.rotation.y=Math.PI/2;g.add(gl)}

const LINK=[],TR_R=.23,TR_X=1.0,TR_Y0=.04,PATH=2*TR_X*2+2*Math.PI*TR_R;

{const g=part('tracks');const lm=S(0x3a3a3a,{metalness:.6,roughness:.5});for(const side of[1,-1]){for(let i=0;i<36;i++){const l=box(.13,.045,.32,lm);l.position.z=side*.98;g.add(l);LINK.push({l,i,side})}
   for(const x of[-TR_X,TR_X]){const sp=cylZ(.2,.28,darkM,20);sp.position.set(x,TR_Y0+TR_R,side*.98);g.add(sp)}}

 for(const s of[1,-1]){const sk=box(2.2,.34,.05,olive);sk.position.set(-.05,.52,s*1.17);sk.rotation.x=-s*.28;g.add(sk)}
 const rr=box(.06,.4,1.8,olive);rr.position.set(-1.12,.5,0);rr.rotation.z=-.5;g.add(rr)}

const aimYaw=(p)=>Math.atan2(-(TGT.z-p.z),TGT.x-p.x);

const popS=(t,t0)=>{const u=(t-t0)/.35;if(u<0)return 0;if(u>=1)return 1;const c=1.70158;return 1+(c+1)*Math.pow(u-1,3)+c*Math.pow(u-1,2)};

  const trk=popS(t,addT.tracks),whl=has('wheels',t),stb=has('stab',t),tur=popS(t,addT.turret),rcl=has('recoil',t);

  if(trk>0){const hs=[];for(let s=-1;s<=1.001;s+=.1)hs.push(Hgt(x+s));const hb=Math.max(...hs.slice(0,11)),hf=Math.max(...hs.slice(10));y=(hf+hb)/2;pitch=Math.atan2(hf-hb,2)}
