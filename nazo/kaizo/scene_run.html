<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
@font-face{font-family:"JumpSans";font-weight:400;src:url(fonts_jp/NotoSansCJKjp-Regular.woff2) format("woff2")}
@font-face{font-family:"JumpSans";font-weight:700;src:url(fonts_jp/NotoSansCJKjp-Bold.woff2) format("woff2")}
@font-face{font-family:"JumpSans";font-weight:900;src:url(fonts_jp/NotoSansCJKjp-Black.woff2) format("woff2")}
html,body{margin:0;background:#000}
#stage{position:relative;width:540px;height:960px;overflow:hidden}
#stage canvas{position:absolute;left:0;top:0}
#hud{position:absolute;left:0;top:0;width:540px;height:960px;font-family:"JumpSans"}
#hud text{paint-order:stroke;stroke:#101010;stroke-linejoin:round;fill:#fff}
</style></head>
<body><div id="stage"><svg id="hud" viewBox="0 0 540 960" xmlns="http://www.w3.org/2000/svg"></svg></div>
<script src="vendor.js"></script>
<script>
// もしもショート「走る速さが1秒ごとに2倍」。道路を走る人が、歩く人→自転車→車→新幹線→旅客機→音速（衝撃波）→ライフル弾を追いこし、地球を回り、飛び出す
// 行の fx：hook / walk / bike / car / shin / plane / boom / bullet / orbit / escape / real / end。params.st[fx]=[秒, 秒速m]
const getJ=u=>{const x=new XMLHttpRequest();x.open('GET',u,false);x.send();if(x.status!==200)throw new Error('読めない: '+u);return JSON.parse(x.responseText)};
const ID=(new URLSearchParams(location.search).get('spec')||'run_ja').replace(/^.*\//,'').replace(/\.json$/,'');
const SPEC=getJ('specs/'+ID+'.json'),TL=getJ('specs/'+ID+'_timeline.json');
const W=540,H=960,DUR=TL.total;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x)),lerp=(a,b,k)=>a+(b-a)*k,sstep=(a,b,x)=>{const k=clamp((x-a)/(b-a),0,1);return k*k*(3-2*k)};
function rng(seed){let s=seed>>>0;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}}
const LINES=SPEC.lines.map((l,i)=>Object.assign({},l,TL.beats[i]));
const fxL=fx=>LINES.find(l=>l.fx===fx);const T0=fx=>{const l=fxL(fx);return l?l.t0:1e9};const T1=fx=>{const l=fxL(fx);return l?l.t1:1e9};
const LAB=SPEC.labels||{},PRM=SPEC.params||{},ST=PRM.st||{},EN=PRM.lang==='en';
const TX=EN?{start:'START',sec:n=>n+(n===1?' second':' seconds'),kmh:'',kms:'',uh:'km/h',us:'km/s',mach:'Mach ',vs:'vs ',note:'Not to scale'}:{start:'スタート',sec:n=>n+'秒後',kmh:'時速',kms:'秒速',uh:'km',us:'km',mach:'マッハ',vs:'くらべる：',note:'大きさ・距離は縮めて表示'};
const lineIdx=t=>{let i=0;for(let k=0;k<LINES.length;k++)if(LINES[k].t0-.05<=t)i=k;return i};
// いまの「秒」と「秒速」：行の頭で前の行の値から0.7秒かけて対数で寄せる
function stat(t){const i=lineIdx(t),c=ST[LINES[i].fx]||[0,5],snap=LINES[i].fx==='real'||LINES[i].fx==='end',p=i>0&&!snap?(ST[LINES[i-1].fx]||c):c,k=sstep(LINES[i].t0-.05,LINES[i].t0+.65,t);
  return{sec:lerp(p[0],c[0],k),v:Math.exp(lerp(Math.log(p[1]),Math.log(c[1]),k)),fx:LINES[i].fx,i}}
// 見た目の速さ（実際は縮める）と、その積分＝景色の進み
const vVis=v=>4.5+6.5*Math.log2(Math.max(1,v/5));
const SDT=.01,STAB=(()=>{const n=Math.ceil(DUR/SDT)+2,a=new Float32Array(n);for(let i=1;i<n;i++)a[i]=a[i-1]+vVis(stat(i*SDT).v)*SDT;return a})();
const sAt=t=>{const f=clamp(t/SDT,0,STAB.length-1.001),i=Math.floor(f);return lerp(STAB[i],STAB[i+1],f-i)};

const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(W,H);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById('stage').prepend(renderer.domElement);
const mesh=(g,m)=>new THREE.Mesh(g,m),STD=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.6,metalness:0},o||{}));
const canvasTex=(w,h,draw,rep)=>{const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping}return t};
const scene=new THREE.Scene();
const SKYT=canvasTex(4,512,(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#4f8fd8');g.addColorStop(.55,'#a6cdf0');g.addColorStop(1,'#e3eef6');x.fillStyle=g;x.fillRect(0,0,w,h)});
const SPACEC=new THREE.Color('#02040b');scene.background=SKYT;const FOG=new THREE.Fog(0xd5e5f2,120,700);scene.fog=FOG;
scene.add(new THREE.HemisphereLight(0xdfeeff,0x7c8a6a,1.2));
const sun=new THREE.DirectionalLight(0xfff1dc,2.6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);{const c=sun.shadow.camera;c.left=-30;c.right=30;c.top=30;c.bottom=-30;c.near=1;c.far=200;sun.shadow.bias=-.0004;sun.shadow.normalBias=.02}
scene.add(sun);scene.add(sun.target);

// ---------- 道路と街（走る人は x=0、z=LANE に固定。景色が -x へ流れる） ----------
const CITY=new THREE.Group();scene.add(CITY);
const LANE=-1.75,LOOP=480;
const wrapX=(x0,s)=>{let x=((x0-s)%LOOP+LOOP)%LOOP;return x-LOOP*.3};
const ground=mesh(new THREE.PlaneGeometry(4000,4000),STD(0x8fa47c,{roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.02;ground.receiveShadow=true;CITY.add(ground);
const roadTex=canvasTex(512,512,(x,w,h)=>{x.fillStyle='#4a4d52';x.fillRect(0,0,w,h);const r=rng(4);for(let i=0;i<5000;i++){const v=60+r()*40|0;x.fillStyle=`rgb(${v},${v+2},${v+5})`;x.fillRect(r()*w,r()*h,2,2)}
  x.fillStyle='#f2f2ee';x.fillRect(0,40,w,10);x.fillRect(0,h-50,w,10);x.fillStyle='#e9d66b';x.fillRect(0,h/2-9,w,7);x.fillRect(0,h/2+2,w,7);
  x.fillStyle='#f2f2ee';for(let i=0;i<2;i++){x.fillRect(i*256,h*.27,150,7);x.fillRect(i*256,h*.73-7,150,7)}},true);
const ROADL=1600,road=mesh(new THREE.PlaneGeometry(ROADL,14),STD(0xffffff,{map:roadTex,roughness:.9}));roadTex.repeat.set(ROADL/14,1);road.rotation.x=-Math.PI/2;road.position.y=0;road.receiveShadow=true;CITY.add(road);
const walkTex=canvasTex(256,256,(x,w,h)=>{x.fillStyle='#bdb7ad';x.fillRect(0,0,w,h);x.strokeStyle='#a39d93';x.lineWidth=3;for(let i=0;i<=4;i++){x.beginPath();x.moveTo(i*64,0);x.lineTo(i*64,h);x.stroke();x.beginPath();x.moveTo(0,i*64);x.lineTo(w,i*64);x.stroke()}},true);
const walks=[8.6,-8.6].map(z=>{const m=mesh(new THREE.PlaneGeometry(ROADL,3.2),STD(0xffffff,{map:walkTex,roughness:.95}));m.rotation.x=-Math.PI/2;m.position.set(0,.08,z);m.receiveShadow=true;CITY.add(m);return m});walkTex.repeat.set(ROADL/3.2,1);
const curb=[7,-7].map(z=>{const m=mesh(new THREE.BoxGeometry(ROADL,.16,.25),STD(0xd9d6cf));m.position.set(0,.08,z);m.receiveShadow=true;CITY.add(m);return m});
// ビル（窓のテクスチャを形ごとに分ける）
function winTex(base,glass,cols,rows){return canvasTex(256,512,(x,w,h)=>{x.fillStyle=base;x.fillRect(0,0,w,h);const r=rng(cols*7+rows);const cw=w/cols,rh=h/rows;
  for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){const l=r();x.fillStyle=l>.85?'#f6e7b0':glass;x.fillRect(i*cw+cw*.16,j*rh+rh*.2,cw*.68,rh*.58);x.fillStyle='rgba(255,255,255,.18)';x.fillRect(i*cw+cw*.16,j*rh+rh*.2,cw*.68,rh*.12)}})}
const BLD=[];
[[14,34,14,'#d8d2c4','#5d7690',4,9],[18,58,16,'#9eb0bf','#3e5a78',5,16],[12,22,12,'#c9a98c','#6a7f95',3,6],[20,80,18,'#e4e7ea','#4a6788',6,22]].forEach(([w,h,d,b,g,c,r],k)=>{
  const tex=winTex(b,g,c,r),mat=[STD(0xffffff,{map:tex,roughness:.5,metalness:.1}),STD(0xffffff,{map:tex,roughness:.5,metalness:.1}),STD(b),STD(b),STD(0xffffff,{map:tex,roughness:.5,metalness:.1}),STD(0xffffff,{map:tex,roughness:.5,metalness:.1})];
  const N=26,im=new THREE.InstancedMesh(new THREE.BoxGeometry(w,h,d),mat,N);im.castShadow=true;im.receiveShadow=true;im.frustumCulled=false;CITY.add(im);
  const r0=rng(31+k),pos=[];for(let i=0;i<N;i++){const side=i%2?1:-1;pos.push([r0()*LOOP,h/2,side*(side>0?(17+d/2+r0()*24):(32+d/2+r0()*26))])}BLD.push({im,pos})});
// 木と街灯
const TREE=(()=>{const g=new THREE.Group(),tr=mesh(new THREE.CylinderGeometry(.18,.24,2.4,8),STD(0x6b4a2f));tr.position.y=1.2;tr.castShadow=true;g.add(tr);
  [[0,3.4,0,1.6],[.5,4.4,.2,1.2],[-.4,4.2,-.3,1.1]].forEach(([x,y,z,r])=>{const s=mesh(new THREE.IcosahedronGeometry(r,1),STD(0x4f8a3f,{flatShading:true,roughness:.9}));s.position.set(x,y,z);s.castShadow=true;g.add(s)});return g})();
const LAMP=(()=>{const g=new THREE.Group(),p=mesh(new THREE.CylinderGeometry(.08,.11,6,10),STD(0x6d737a,{metalness:.6,roughness:.4}));p.position.y=3;g.add(p);
  const a=mesh(new THREE.BoxGeometry(1.6,.12,.12),STD(0x6d737a,{metalness:.6,roughness:.4}));a.position.set(0,5.9,-.7);a.rotation.y=Math.PI/2;g.add(a);const h=mesh(new THREE.BoxGeometry(.5,.16,.3),STD(0xf4f1e6,{emissive:0x332f22}));h.position.set(0,5.82,-1.4);g.add(h);g.traverse(o=>{if(o.isMesh)o.castShadow=true});return g})();
const PROPS=[];for(let i=0;i<24;i++){const side=i%2?1:-1,o=(i%4<2?TREE:LAMP).clone();if(side<0)o.rotation.y=Math.PI;CITY.add(o);PROPS.push({o,x:i*LOOP/24+(i%4<2?0:8),z:side*(i%4<2?9.6:7.6)})}
// 高架の線路（新幹線用）
const VIAZ=-16,VIAY=1.4;
const deck=mesh(new THREE.BoxGeometry(ROADL,1.2,8),STD(0xc9c7c2));deck.position.set(0,VIAY-.6,VIAZ);deck.castShadow=true;deck.receiveShadow=true;CITY.add(deck);
const wallV=[1,-1].map(s=>{const m=mesh(new THREE.BoxGeometry(ROADL,1.1,.25),STD(0xdedcd6));m.position.set(0,VIAY+.55,VIAZ+s*3.9);m.castShadow=true;CITY.add(m);return m});
const PIL=[];for(let i=0;i<20;i++){const m=mesh(new THREE.BoxGeometry(1.6,VIAY-1.2,2.4),STD(0xbcbab4));m.castShadow=true;m.receiveShadow=true;CITY.add(m);PIL.push({o:m,x:i*LOOP/20})}
// 速さの線（速いときだけ）
const SPL=[];{const r=rng(77);for(let i=0;i<70;i++){const m=mesh(new THREE.BoxGeometry(1,.03,.03),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,depthWrite:false,fog:false}));CITY.add(m);SPL.push({o:m,x:r()*80-20,y:.3+r()*4,z:LANE+(r()-.5)*9,l:3+r()*6,sp:.7+r()*.6})}}

// ---------- 追いこす相手 ----------
function walker(color){const g=new THREE.Group(),P={};const sk=STD(0xe7c3a5),cl=STD(color),pn=STD(0x2f3a4c);
  const add=(k,geo,mat,x,y,z,par)=>{const m=mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;(par||g).add(m);P[k]=m;return m};
  add('torso',new THREE.CapsuleGeometry(.2,.5,6,12),cl,0,1.2,0);add('head',new THREE.SphereGeometry(.13,20,14),sk,0,1.68,0);add('hair',new THREE.SphereGeometry(.135,20,14,0,6.3,0,1.6),STD(0x2b1d14),0,1.7,-.01);
  for(const s of[-1,1]){const hip=new THREE.Group();hip.position.set(.1*s,.9,0);g.add(hip);add('leg'+s,new THREE.CapsuleGeometry(.075,.7,4,8),pn,0,-.42,0,hip);P['hip'+s]=hip;
    const sh=new THREE.Group();sh.position.set(.27*s,1.42,0);g.add(sh);add('arm'+s,new THREE.CapsuleGeometry(.06,.5,4,8),cl,0,-.3,0,sh);P['sh'+s]=sh}
  g.userData.pose=ph=>{for(const s of[-1,1]){P['hip'+s].rotation.x=.45*Math.sin(ph)*s;P['sh'+s].rotation.x=-.4*Math.sin(ph)*s}};return g}
const WALKERS=new THREE.Group();CITY.add(WALKERS);[[0x3d7cc9,0],[0xd4573b,2.2],[0x6aa84f,4.6]].forEach(([c,dx],i)=>{const w=walker(c);w.position.set(dx,.16,-8.2+i*.6);w.rotation.y=Math.PI/2;WALKERS.add(w)});
// 自転車
const BIKE=(()=>{const g=new THREE.Group(),fr=STD(0xd9342b,{metalness:.4,roughness:.35}),tire=STD(0x1b1b1b,{roughness:.8}),rim=STD(0xcfd3d6,{metalness:.9,roughness:.25});
  const wheels=[];for(const x of[-.55,.55]){const w=new THREE.Group();w.position.set(x,.36,0);const t=mesh(new THREE.TorusGeometry(.33,.035,10,36),tire);w.add(t);const r=mesh(new THREE.TorusGeometry(.3,.012,6,36),rim);w.add(r);
    for(let i=0;i<8;i++){const sp=mesh(new THREE.CylinderGeometry(.005,.005,.6,4),rim);sp.rotation.z=i*Math.PI/8;w.add(sp)}g.add(w);wheels.push(w)}
  const tube=(a,b,r)=>{const d=new THREE.Vector3().subVectors(b,a),m=mesh(new THREE.CylinderGeometry(r,r,d.length(),10),fr);m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());m.castShadow=true;g.add(m)};
  const V=(x,y)=>new THREE.Vector3(x,y,0);tube(V(-.55,.36),V(-.05,.36),.022);tube(V(-.05,.36),V(-.18,.86),.025);tube(V(-.18,.86),V(.42,.86),.025);tube(V(-.05,.36),V(.42,.86),.028);tube(V(.42,.86),V(.55,.36),.022);tube(V(-.55,.36),V(-.18,.86),.018);tube(V(.42,.86),V(.38,1.05),.02);
  const bar=mesh(new THREE.CylinderGeometry(.018,.018,.5,8),STD(0x222222));bar.rotation.x=Math.PI/2;bar.position.set(.38,1.05,0);g.add(bar);const seat=mesh(new THREE.BoxGeometry(.24,.05,.12),STD(0x222222));seat.position.set(-.2,.92,0);g.add(seat);
  const rider=walker(0x2a6f97);rider.position.set(-.12,-.1,0);rider.rotation.y=Math.PI/2;rider.rotation.x=0;g.add(rider);rider.children[0].rotation.x=0;
  g.userData.spin=a=>{wheels.forEach(w=>w.rotation.z=-a);rider.userData.pose(a)};return g})();CITY.add(BIKE);
// 車（横からの形を押し出し、角を丸める）
function carMesh(paint){const g=new THREE.Group(),s=new THREE.Shape();s.moveTo(-2.25,.32);s.lineTo(2.2,.32);s.quadraticCurveTo(2.35,.35,2.32,.75);s.lineTo(2.1,.95);s.lineTo(.9,1.05);s.quadraticCurveTo(.4,1.48,-.2,1.5);s.lineTo(-1.25,1.48);s.quadraticCurveTo(-1.85,1.4,-2.15,1.0);s.lineTo(-2.3,.8);s.closePath();
  const body=mesh(new THREE.ExtrudeGeometry(s,{depth:1.56,bevelEnabled:true,bevelThickness:.12,bevelSize:.1,bevelSegments:4,curveSegments:16}),new THREE.MeshPhysicalMaterial({color:paint,metalness:.55,roughness:.28,clearcoat:1,clearcoatRoughness:.08}));body.position.z=-.78;body.castShadow=true;g.add(body);
  const w=new THREE.Shape();w.moveTo(.75,1.07);w.quadraticCurveTo(.35,1.42,-.2,1.44);w.lineTo(-1.2,1.42);w.quadraticCurveTo(-1.65,1.36,-1.9,1.06);w.closePath();
  const gl=mesh(new THREE.ExtrudeGeometry(w,{depth:1.64,bevelEnabled:true,bevelThickness:.05,bevelSize:.04,bevelSegments:2}),STD(0x1d2833,{metalness:.9,roughness:.08}));gl.position.z=-.82;g.add(gl);
  const wh=[];for(const x of[-1.45,1.4])for(const z of[-.82,.82]){const t=new THREE.Group();t.position.set(x,.36,z);const tt=mesh(new THREE.CylinderGeometry(.36,.36,.26,24),STD(0x151515,{roughness:.85}));tt.rotation.x=Math.PI/2;t.add(tt);const hub=mesh(new THREE.CylinderGeometry(.22,.22,.28,12),STD(0xc8ccd0,{metalness:.9,roughness:.2}));hub.rotation.x=Math.PI/2;t.add(hub);g.add(t);wh.push(t)}
  for(const z of[-.55,.55]){const hl=mesh(new THREE.BoxGeometry(.1,.14,.32),STD(0xffffff,{emissive:0xfff4cc,emissiveIntensity:.8}));hl.position.set(2.36,.72,z);g.add(hl);const tl=mesh(new THREE.BoxGeometry(.08,.12,.34),STD(0xb3141b,{emissive:0x7a0000}));tl.position.set(-2.33,.88,z);g.add(tl)}
  g.userData.spin=a=>wh.forEach(t=>t.rotation.z=-a);return g}
const CARS=new THREE.Group();CITY.add(CARS);[[0x1f5fa8,0,1.75],[0xe7e7e2,-9,5.25],[0xb02a2a,7,5.25]].forEach(([c,dx,z])=>{const m=carMesh(c);m.position.set(dx,0,z);CARS.add(m)});
// 新幹線（先頭は長い鼻、後ろは断面を押し出した車体）
const SHIN=(()=>{const g=new THREE.Group(),white=new THREE.MeshPhysicalMaterial({color:0xf3f4f2,roughness:.25,clearcoat:.8}),blue=STD(0x1f3f8f,{roughness:.3}),glass=STD(0x14202c,{metalness:.8,roughness:.1});
  const sec=new THREE.Shape(),hw=1.7,hh=3.6;sec.moveTo(-hw,.2);sec.lineTo(hw,.2);sec.quadraticCurveTo(hw+.05,2.6,hw-.35,hh);sec.lineTo(-hw+.35,hh);sec.quadraticCurveTo(-hw-.05,2.6,-hw,.2);
  const car=(len,x)=>{const m=mesh(new THREE.ExtrudeGeometry(sec,{depth:len,bevelEnabled:false,curveSegments:12}),white);m.rotation.y=Math.PI/2;m.position.set(x,0,0);m.castShadow=true;g.add(m);
    const st=mesh(new THREE.BoxGeometry(len,.32,3.46),blue);st.position.set(x+len/2,1.35,0);g.add(st);const wn=mesh(new THREE.BoxGeometry(len-1,.55,3.44),glass);wn.position.set(x+len/2,2.35,0);g.add(wn)};
  for(let i=1;i<=4;i++)car(24.6,-i*25);
  const nose=new THREE.LatheGeometry(Array.from({length:24},(_,i)=>{const k=i/23;return new THREE.Vector2(Math.max(.02,1.75*Math.pow(k,.55)),k*15)}),40);
  const n=mesh(nose,white);n.rotation.z=-Math.PI/2;n.position.set(15,1.9,0);n.scale.set(1,1,1.05);n.castShadow=true;g.add(n);
  const nb=mesh(new THREE.BoxGeometry(15,1.7,3.4),white);nb.position.set(7.5,1.05,0);g.add(nb);const ns=mesh(new THREE.BoxGeometry(11,.3,3.46),blue);ns.position.set(5.5,1.35,0);g.add(ns);
  const cab=mesh(new THREE.SphereGeometry(1,24,16,0,6.3,0,1.2),glass);cab.scale.set(2.6,.55,1.15);cab.position.set(4.5,3.1,0);g.add(cab);g.scale.setScalar(.9);return g})();CITY.add(SHIN);
// 旅客機
const PLANE=(()=>{const g=new THREE.Group(),w=new THREE.MeshPhysicalMaterial({color:0xf5f6f7,roughness:.3,clearcoat:.6}),b=STD(0x2456a6,{roughness:.35}),gr=STD(0x9aa3ad,{metalness:.7,roughness:.3});
  const prof=[];for(let i=0;i<=40;i++){const k=i/40,x=k*38;let r=2.0;if(k<.12)r=2.0*Math.sqrt(k/.12);if(k>.72)r=2.0*(1-(k-.72)/.28*.85);prof.push(new THREE.Vector2(Math.max(.05,r),x))}
  const f=mesh(new THREE.LatheGeometry(prof,36),w);f.rotation.z=Math.PI/2;f.position.x=19;f.castShadow=true;g.add(f);
  const wing=new THREE.Shape();wing.moveTo(0,0);wing.lineTo(-5,17);wing.lineTo(-7.5,17);wing.lineTo(-8.5,0);wing.closePath();
