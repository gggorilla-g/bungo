<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
@font-face{font-family:"JumpSans";font-weight:400;src:url(fonts_jp/NotoSansCJKjp-Regular.woff2) format("woff2")}
@font-face{font-family:"JumpSans";font-weight:700;src:url(fonts_jp/NotoSansCJKjp-Bold.woff2) format("woff2")}
@font-face{font-family:"JumpSans";font-weight:900;src:url(fonts_jp/NotoSansCJKjp-Black.woff2) format("woff2")}
html,body{margin:0;background:#000}
#stage{position:relative;width:540px;height:960px;overflow:hidden;background:#020604}
#stage canvas{position:absolute;left:0;top:0}
#hud{position:absolute;left:0;top:0;width:540px;height:960px;font-family:"JumpSans"}
#hud text{paint-order:stroke;stroke:#020604;stroke-linejoin:round;fill:#fff}
</style></head>
<body><div id="stage"><canvas id="glow" width="540" height="960"></canvas><svg id="hud" viewBox="0 0 540 960" xmlns="http://www.w3.org/2000/svg"></svg></div>
<script src="vendor.js"></script>
<script>
// リーマン予想（雑学）：素数、ゼータ関数の零点、1本の線、1700万行の証明。ネオンのワイヤーの3D。落ち着いた拍（72）
const getJ=u=>{const x=new XMLHttpRequest();x.open('GET',u,false);x.send();if(x.status!==200)throw new Error('読めない: '+u);return JSON.parse(x.responseText)};
const ID=(new URLSearchParams(location.search).get('spec')||'ui_rh_ja').replace(/^.*\//,'').replace(/\.json$/,'');
const SPEC=getJ('specs/'+ID+'.json'),TL=getJ('specs/'+ID+'_timeline.json');
const W=540,H=960,DUR=TL.total,LAB=SPEC.labels||{},BEAT=60/(LAB.bpm||120);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x)),lerp=(a,b,k)=>a+(b-a)*k,sstep=(a,b,x)=>{const k=clamp((x-a)/(b-a),0,1);return k*k*(3-2*k)};
const LINES=SPEC.lines.map((l,i)=>Object.assign({},l,TL.beats[i]));
const L_=fx=>LINES.find(l=>l.fx===fx);
const T0=(fx,a)=>{const l=L_(fx);return l?l.t0+(a||0)*l.voice:1e9};
const lineAt=t=>LINES.filter(l=>l.t0<=t+.001).pop()||LINES[0];
const pulse=t=>Math.exp(-((t%BEAT)/BEAT)*5);     // 拍の頭で1、すぐ落ちる

const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true,alpha:false});
renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(W,H);
document.getElementById('stage').prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x020604);scene.fog=new THREE.Fog(0x020604,14,40);
const cam=new THREE.PerspectiveCamera(38,W/H,.05,200);

// ---- ネオンのワイヤー部品：暗い面＋光る辺（2重にして太く見せる）
const NEON=[];
function wire(geo,col,opt){opt=opt||{};const g=new THREE.Group();
  const face=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:new THREE.Color(col).multiplyScalar(opt.fill||.05),transparent:true,opacity:opt.op||.55,depthWrite:true}));g.add(face);
  const eg=new THREE.EdgesGeometry(geo,opt.th||14);
  const m1=new THREE.LineBasicMaterial({color:col,transparent:true,opacity:1});const l1=new THREE.LineSegments(eg,m1);g.add(l1);
  const m2=new THREE.LineBasicMaterial({color:col,transparent:true,opacity:.45});const l2=new THREE.LineSegments(eg,m2);l2.scale.setScalar(1.012);g.add(l2);
  g.userData={col:new THREE.Color(col),m1,m2,face};NEON.push(g);return g}
function setGlow(g,k){const c=g.userData.col.clone().multiplyScalar(.55+.7*k);g.userData.m1.color.copy(c);g.userData.m2.opacity=.25+.6*k}

let seed=3;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const isP=n=>{if(n<2)return false;for(let d=2;d*d<=n;d++)if(n%d===0)return false;return true};
// ---- 数の箱（1〜48、横12×縦4）。素数は光る
const NB=48,boxes=[];
for(let n=1;n<=NB;n++){const c=(n-1)%6,r=Math.floor((n-1)/6);const g=wire(new THREE.BoxGeometry(.34,.34,.34),0x25d877,{fill:.1,op:.7});g.position.set(1.6+(c-2.5)*.44,6.9-r*.44,1.8);g.userData.n=n;scene.add(g);boxes.push(g)}
// ---- 素数の宝石：素数の箱から金色の結晶が浮かび上がり、回りながら光る（オーナー 11/24「素数自体に価値があるような見せ方」）
const gems=boxes.filter(g=>isP(g.userData.n)).map(b=>{const g=wire(new THREE.OctahedronGeometry(.15,0),0xffd166,{fill:.55,op:.9,th:1});g.scale.set(1,1.35,1);g.position.copy(b.position);g.visible=false;scene.add(g);
  const h=new THREE.Mesh(new THREE.SphereGeometry(.21,16,12),new THREE.MeshBasicMaterial({color:0xffc94d,transparent:true,opacity:0,depthWrite:false}));scene.add(h);
  const r=new THREE.Mesh(new THREE.RingGeometry(.2,.22,48),new THREE.MeshBasicMaterial({color:0xfff1b8,transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false}));scene.add(r);
  return {g,h,r,b,n:b.userData.n}});
// ---- 複素数の平面（右）：実部0と1の縦の帯、まん中の線（実部1/2）、零点
const PX=1.6,SY=.11;            // 帯の位置と、虚部の縮尺（1単位→.11）
const plane=new THREE.Group();plane.position.set(PX,0,0);scene.add(plane);
const strip=[0,1].map(x=>{const m=new THREE.LineBasicMaterial({color:0x0f8a48,transparent:true,opacity:.5});const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3((x-.5)*1.6,.15,0),new THREE.Vector3((x-.5)*1.6,9.2,0)]),m);plane.add(l);return m});
const crit=new THREE.Mesh(new THREE.BoxGeometry(.03,9.05,.03),new THREE.MeshBasicMaterial({color:0xc8ffe0,transparent:true,opacity:.0}));crit.position.set(0,4.675,0);plane.add(crit);
const critG=new THREE.Mesh(new THREE.BoxGeometry(.09,9.05,.09),new THREE.MeshBasicMaterial({color:0xc8ffe0,transparent:true,opacity:.0}));critG.position.copy(crit.position);plane.add(critG);
const ZS=[14.1347,21.0220,25.0109,30.4249,32.9351,37.5862,40.9187,43.3271,48.0052,49.7738,52.9703,56.4462,59.3470,60.8318,65.1125,67.0798,69.5464,72.0672,75.7047,77.1448];
const zeros=ZS.map((z,i)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(.09,16,12),new THREE.MeshBasicMaterial({color:0xffe066,transparent:true,opacity:0}));m.position.set(0,.2+z*SY,.05);plane.add(m);
  const h=new THREE.Mesh(new THREE.SphereGeometry(.14,16,12),new THREE.MeshBasicMaterial({color:0xffd166,transparent:true,opacity:0}));h.position.copy(m.position);plane.add(h);return {m,h,y:m.position.y}});
// 調べる線（下から上へ走る）
const scanM=new THREE.MeshBasicMaterial({color:0x9dffc4,transparent:true,opacity:0});const scan=new THREE.Mesh(new THREE.BoxGeometry(2.2,.025,.025),scanM);plane.add(scan);
// ---- 証明の行（左奥）：光る横棒が上へ流れる
const CODE=new THREE.Group();CODE.position.set(-4.8,0,-1.2);scene.add(CODE);
const bars=[];for(let i=0;i<70;i++){const w=.3+rnd()*2.2,ind=Math.floor(rnd()*4)*.25;const m=new THREE.Mesh(new THREE.BoxGeometry(w,.035,.02),new THREE.MeshBasicMaterial({color:[0x35ff8a,0x1faa5c,0x9dffc4,0xffd166][i%4],transparent:true,opacity:0}));m.userData={w,ind,i};m.position.set(-1.4+ind+w/2,0,0);CODE.add(m);bars.push(m)}
// 検査のしるし（4つ）
const checks=[0,1,2,3].map(i=>{const g=wire(new THREE.TorusGeometry(.28,.03,8,40),0x9dff7a,{fill:.6,th:60});g.position.set(-6.3+i*.85,1.0,.4);g.visible=false;scene.add(g);return g});
// ---- 床：音ゲーのような光るレーン（拍で手前へ流れる）
const grid=new THREE.Group();scene.add(grid);
const gm=new THREE.LineBasicMaterial({color:0x0f8a48,transparent:true,opacity:.55});
{const pts=[];for(let x=-12;x<=12;x+=1){pts.push(new THREE.Vector3(x,0,-30),new THREE.Vector3(x,0,8))}
 grid.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),gm))}
const rows=[];const rm=new THREE.LineBasicMaterial({color:0x0f8a48,transparent:true,opacity:.5});
for(let i=0;i<20;i++){const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-12,0,0),new THREE.Vector3(12,0,0)]),rm.clone());grid.add(l);rows.push(l)}
// 星くず
{const g=new THREE.BufferGeometry();const a=[];let s=7;const r=()=>{s=(s*16807)%2147483647;return s/2147483647};for(let i=0;i<500;i++)a.push((r()-.5)*60,r()*18+2,-r()*40-4);
 g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x4dff9a,size:.06,transparent:true,opacity:.7})))}

const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const CAM={
 hook:[V(PX+4.2,5.2,13.5),V(PX,4.6,0),'orbit'],
 riemann:[V(PX+.9,6.0,14.0),V(PX,5.2,0),'push'],
 prime:[V(PX,5.6,12.8),V(PX,5.1,1.8),'push'],
 zeta:[V(PX+2.4,5.0,13.0),V(PX,4.6,0),'orbit'],
 line:[V(PX+3.0,4.6,12.5),V(PX,4.6,0),'push'],
 check:[V(PX-2.6,4.6,12.0),V(PX,4.6,0),'orbit'],
 prize:[V(PX+4.2,5.4,13.5),V(PX,4.6,0),'orbit'],
 news:[V(PX-3.4,5.0,13.5),V(PX,4.6,0),'orbit'],
 lean:[V(-3.0,2.6,5.6),V(-4.8,2.4,-1.2),'side'],
 kernel:[V(-4.6,2.2,5.4),V(-5.0,1.6,-.4),'push'],
 human:[V(-4.0,3.0,8.6),V(-4.6,2.6,-1.2),'pull'],
 end:[V(PX+4.2,5.0,13.5),V(PX,4.6,0),'orbit']};
function camAt(t){const l=lineAt(t),c=CAM[l.fx]||CAM.hook,u=clamp((t-l.t0)/Math.max(.5,l.t1-l.t0),0,1);const p=c[0].clone(),q=c[1].clone();const k=c[2],e=u*u*(3-2*u);
  if(k==='orbit'){const d=p.clone().sub(q);const a=(e-.5)*.42;p.copy(q).add(new THREE.Vector3(d.x*Math.cos(a)-d.z*Math.sin(a),d.y,d.x*Math.sin(a)+d.z*Math.cos(a)))}
  else if(k==='push'){p.lerp(q,e*.13)}else if(k==='pull'){p.lerp(q,-.12*e)}
  else if(k==='rise'){p.y+=3.6*e;q.y+=3.6*e}
  else if(k==='side'){p.x+=.6*e;p.y+=.3*e}
  p.y+=.01*pulse(t);return [p,q]}
// ---- 画面の文字
const NS='http://www.w3.org/2000/svg',hud=document.getElementById('hud');
function el(tag,a,txt){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;hud.appendChild(e);return e}
const tw=s=>{let w=0;for(const ch of String(s))w+=ch.charCodeAt(0)<256?.58:1;return w};
function drawHud(t){hud.innerHTML='';const l=lineAt(t),a=clamp((t-l.t0)/.12,0,1),pb=pulse(t);
  if(LAB.topic){const fs=Math.min(15,470/tw(LAB.topic));const w=tw(LAB.topic)*fs+34;el('rect',{x:270-w/2,y:44,width:w,height:fs+18,rx:(fs+18)/2,fill:'#020604','fill-opacity':.6,stroke:'#35ff8a','stroke-width':1,'stroke-opacity':.35+.15*pb});
    el('text',{x:270,y:44+fs+3,'text-anchor':'middle','font-size':fs,'font-weight':400,'stroke-width':0,'letter-spacing':3,style:'fill:#8dffb8'},LAB.topic)}
  const cap=l.cap||[];let y=cap.length>1?772:790;
  cap.forEach((c,i)=>{const size=Math.min(27,400/tw(c));const sc=1;
    const g=el('g',{transform:`translate(270 ${y+(1-a)*8}) scale(${sc})`});
    const e=document.createElementNS(NS,'text');const at={x:0,y:0,'text-anchor':'middle','font-size':size,'font-weight':i===cap.length-1?700:400,'letter-spacing':2,'stroke-width':Math.max(3,size*.16),style:`opacity:${(.3+.7*a).toFixed(2)};fill:${i===cap.length-1?'#8dffb8':'#e9fff0'}`};
    for(const k in at)e.setAttribute(k,at[k]);e.textContent=c;g.appendChild(e);y+=size+13});
  // 拍のメーター（音ゲーふう：下の4つの点が拍で順に光る）
  const bi=Math.floor(t/BEAT)%4;for(let i=0;i<4;i++){const on=i===bi;el('circle',{cx:270+(i-1.5)*26,cy:900,r:on?2.6+1.2*pb:1.8,fill:on?'#35ff8a':'#0f3a22'})}extraHud(t,l,pb)}

const tmpV=new THREE.Vector3();
function at3(x,y,z){tmpV.set(x,y,z).project(cam);return [(tmpV.x+1)/2*W,(1-tmpV.y)/2*H]}
let ST={};
const GC={'#7fe9ff':'#9dffc4','#bdf3ff':'#6fd39b','#ff9fcb':'#c8ffe0','#ffffff':'#e9fff0'};
function big(txt,y,size,fill,pb){const z=size*.62;el('text',{x:270,y,'text-anchor':'middle','font-size':z,'font-weight':z>30?700:400,'letter-spacing':z>30?3:2,'stroke-width':Math.max(3,z*.12),style:`fill:${GC[fill]||fill}`},txt)}
function extraHud(t,l,pb){const s=ST;
  if(s.year)big(s.year,l.fx==='riemann'?150:250,84,'#ffe066',pb);
  if(s.nums)for(const b of s.nums){const [x,y]=at3(b.x,b.y,b.z);el('text',{x,y:y+(b.p?10:6),'text-anchor':'middle','font-size':b.p?30:15,'font-weight':b.p?900:700,'stroke-width':b.p?6:3,style:`fill:${b.p?'#fff4c2':'#2f9a60'};opacity:${b.p?b.o:b.o*.7}`},String(b.n))}
  if(s.half){const [x,y]=at3(PX,7.4,0);el('text',{x:x+14,y,'font-size':15,'font-weight':400,'letter-spacing':2,'stroke-width':3,style:'fill:#c8ffe0'},'実部 1/2')}
  if(s.count!=null){big(s.count,200,58,'#7fe9ff',pb);big('個目も 線の上',250,26,'#bdf3ff',0)}
  if(s.prize)big('100万ドル',230,92,'#ffe066',pb);
  if(s.lines!=null){big(s.lines,190,64,'#ffffff',pb);big('行',240,30,'#bdf3ff',0)}
  if(s.chk!=null){const names=['Lean','nanoda','con-leche','lean4lean'];names.forEach((nm,i)=>{const on=i<s.chk;el('text',{x:90+i*120,y:300,'text-anchor':'middle','font-size':14,'font-weight':400,'letter-spacing':1,'stroke-width':3,style:`fill:${on?'#8dffb8':'#1f5a3a'}`},nm);el('text',{x:90+i*120,y:262,'text-anchor':'middle','font-size':24,'font-weight':700,'letter-spacing':2,'stroke-width':4,style:`fill:${on?'#8dffb8':'#12331f'}`},on?'OK':'…')})}
  if(s.q)big('？',300,150,'#ff9fcb',0)}

const glowC=document.getElementById('glow'),gx=glowC.getContext('2d');
window.renderAt=function(t){const pb=pulse(t),L=lineAt(t),fx=L.fx,Q=BEAT/2;const s=ST={};
  // 数の箱：『素数』の行で1つずつ数え、素数が光る
  const p0=T0('prime',.05),pe=T0('zeta',.6);
  boxes.forEach((g,i)=>{const n=g.userData.n,ta=p0+i*.06,on=t>=ta,pr=isP(n);const fo=1-sstep(T0('zeta',.25),T0('zeta',.6),t);g.visible=t>=T0('riemann')&&fo>0;
    let k=.15,sc=1,z=1.8;
    if(on&&t<pe){if(pr){k=.9+.6*pb+1.6*Math.exp(-(t-ta)*3)}else{const d=sstep(ta,ta+.5,t);k=.22-.14*d;sc=1-.3*d;z=1.8-.9*d}}   // 素数でない数は暗く、小さく、奥へ下がる
    g.scale.setScalar(Math.max(.001,sc*fo));g.position.z=z;setGlow(g,k)});
  gems.forEach((o,j)=>{const ta=p0+(o.n-1)*.06,e=t-ta,fo=1-sstep(T0('zeta',.25),T0('zeta',.6),t),on=e>=0&&fo>0&&t>=T0('prime');o.g.visible=on;
    if(!on){o.h.material.opacity=0;o.r.material.opacity=0;return}
    const up=sstep(0,.45,e);o.g.position.set(o.b.position.x,o.b.position.y+.05*up,1.8+.55*up);o.g.rotation.y=t*1.6+j;o.g.scale.set(fo,1.35*fo,fo);
    setGlow(o.g,1.0+.6*pb+1.8*Math.exp(-e*3));
    o.h.position.copy(o.g.position);o.h.material.opacity=(.18+.12*pb+.5*Math.exp(-e*3))*fo;o.h.scale.setScalar(1+.15*pb);
    o.r.position.copy(o.g.position);o.r.lookAt(cam.position);const rr=Math.min(1,e/.6);o.r.scale.setScalar(1+2.2*rr);o.r.material.opacity=e<.6?.8*(1-rr):0});
  if(fx==='prime'||fx==='riemann'||fx==='zeta')s.nums=boxes.filter(g=>g.visible&&g.scale.x>.6).map(g=>({x:g.position.x,y:g.position.y,z:isP(g.userData.n)&&t>=p0+(g.userData.n-1)*.06&&fx!=='riemann'?2.45:2.0,n:g.userData.n,p:isP(g.userData.n),o:t>=p0+(g.userData.n-1)*.06||fx!=='prime'?1:.25}));
  if(fx==='riemann')s.year='1859';
  // 零点：『ゼロになる点』で、下から順に1つずつ現れる
  const z0=T0('zeta',.45);zeros.forEach((z,i)=>{const a=z0+i*.12;const on=t>=a;z.m.material.opacity=on?1:0;z.h.material.opacity=on?(.25+.25*pb+.6*Math.exp(-(t-a)*4)):0});
  strip.forEach(m=>m.opacity=t>=T0('zeta',.3)?.35+.15*pb:0);
  // 線：『1本の線』で、まん中の線が下から上へ光る
  const l0=T0('line',.35),lk=sstep(l0,l0+1.4,t);crit.material.opacity=lk;critG.material.opacity=.25*lk*(.7+.3*pb);crit.scale.y=Math.max(.001,lk);crit.position.y=.15+4.525*lk;critG.scale.y=crit.scale.y;critG.position.y=crit.position.y;
  if(fx==='line')s.half=1;
  // 調べる：線が上へ走り、通った零点が光る。数が増える
  scanM.opacity=0;
  if(fx==='check'){const u=clamp((t-L.t0-.2)/(L.voice*.85),0,1);scan.position.set(0,.2+u*8.8,.05);scanM.opacity=.9;zeros.forEach(z=>{if(Math.abs(z.y-scan.position.y)<.25)z.h.material.opacity=1});
    s.count=String(zeros.filter(z=>z.y<=scan.position.y+.05).length)}
  if(fx==='prize')s.prize=1;
  if(fx==='news')s.year='2026.11.20';
  // 証明の行：光る横棒が上へ流れ、行数が増える
  const c0=T0('lean'),cv=t>=c0&&t<T0('end');bars.forEach((m,i)=>{const sp=.55,y=((i*.13+(t-c0)*sp)%9.1);m.position.y=y;m.material.opacity=cv?(.12+.3*Math.exp(-Math.abs(y-4.5)/3))*(1-sstep(8.2,9.1,y))*sstep(.6,2.2,y):0});
  if(fx==='lean'){const u=clamp((t-L.t0-.3)/(L.voice*.8),0,1);s.lines=Math.floor(17370000*u*u*(3-2*u)).toLocaleString('ja-JP')}
  // 検査：4つの輪が順に光る
  const k0=T0('kernel',.15);checks.forEach((g,i)=>{const a=k0+i*BEAT*.75;g.visible=false;if(0)setGlow(g,.8+.5*pb+1.4*Math.exp(-(t-a)*3))});
  if(fx==='kernel')s.chk=clamp(Math.floor((t-k0)/(BEAT*.75))+1,0,4);
  if(fx==='human')s.q=1;
  // 終わり：零点と線がゆっくり脈打つ
  if(fx==='end'||fx==='hook'){critG.material.opacity=Math.max(critG.material.opacity,(fx==='hook'?.15:.3)*(.6+.4*pb));zeros.forEach(z=>z.h.material.opacity=Math.max(z.h.material.opacity,.3+.4*pb))}
  if(fx==='hook'){zeros.forEach((z,i)=>{const on=t>=.4+i*.18;z.m.material.opacity=on?1:0;z.h.material.opacity=on?.3+.4*pb:0});crit.material.opacity=.6;crit.scale.y=1;crit.position.y=4.675;strip.forEach(m=>m.opacity=.3)}
  const sc=(t/BEAT)%1;rows.forEach((l,i)=>{const z=-30+((i+sc)/20)*38;l.position.z=z;l.material.opacity=.12+.4*clamp((z+30)/38,0,1)});
  gm.opacity=.3+.2*pb;
  const [p,q]=camAt(t);cam.position.copy(p);cam.lookAt(q);cam.updateProjectionMatrix();cam.updateMatrixWorld();renderer.render(scene,cam);
