<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
@font-face{font-family:"JumpSans";font-weight:700;src:url(fonts_jp/NotoSansCJKjp-Bold.woff2) format("woff2")}
@font-face{font-family:"JumpSans";font-weight:900;src:url(fonts_jp/NotoSansCJKjp-Black.woff2) format("woff2")}
html,body{margin:0;background:#000}
#stage{position:relative;width:540px;height:960px;overflow:hidden}
#stage canvas{position:absolute;left:0;top:0}
#hud{position:absolute;left:0;top:0;width:540px;height:960px;font-family:"JumpSans"}
#hud text{paint-order:stroke;stroke-linejoin:round}
</style></head>
<body><div id="stage"><svg id="hud" viewBox="0 0 540 960" xmlns="http://www.w3.org/2000/svg"></svg></div>
<script src="vendor.js"></script>
<script>
// 動く絵本（ペーパーマリオ式の紙芝居舞台）
//   紙人形＝表は絵、裏は白い紙の板。床に立ち、足元に丸い影（ブロブシャドウ）。
//   動き：ポップアップ（ページの始めに床から起き上がる）／ペーパーフリップ（裏返って振り向く・真横の瞬間にポーズの絵を差し替える）／
//         ホップ（スクワッシュ＆ストレッチ付き）／移動／縮こまる／持ち上げる／傾ける／落ちる
//   ページ替え：幕が閉じて開く。雷：画面が一瞬白く光る。雨：紙の雨粒が降る
const getJ=u=>{const x=new XMLHttpRequest();x.open('GET',u,false);x.send();if(x.status!==200)throw new Error('読めない: '+u);return JSON.parse(x.responseText)};
const SPEC=getJ((new URLSearchParams(location.search).get('spec')||'specs/ehon_test.json'));
const W=540,H=960;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x)),lerp=(a,b,k)=>a+(b-a)*k,ss=(a,b,x)=>{const k=clamp((x-a)/(b-a),0,1);return k*k*(3-2*k)};
const back=(k)=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
function rng(seed){let s=seed>>>0;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}}
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(window.devicePixelRatio||1);renderer.setSize(W,H);renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById('stage').prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x120c14);
const camera=new THREE.PerspectiveCamera(30,W/H,.1,100);
const loader=new THREE.TextureLoader();
const texCache={};
function tex(p){if(!texCache[p]){const t=loader.load(p);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;texCache[p]=t}return texCache[p]}
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}

// ---- 舞台（幕・額縁・床）
const ST=SPEC.stage||{};const SW=ST.width||2.5, BACKZ=-2.0, FRONTZ=1.3;
const velvet=canvasTex(512,512,(x,w,h)=>{for(let i=0;i<w;i++){const k=.5+.5*Math.sin(i/w*Math.PI*14);x.fillStyle=`rgb(${110+70*k|0},${18+14*k|0},${28+16*k|0})`;x.fillRect(i,0,1,h)}const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(0,0,0,.35)');g.addColorStop(.3,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.45)');x.fillStyle=g;x.fillRect(0,0,w,h)});
const matV=new THREE.MeshBasicMaterial({map:velvet});
const mk=(g,m)=>new THREE.Mesh(g,m);
const sideL=mk(new THREE.PlaneGeometry(1.2,5),matV);sideL.position.set(-1.45,1.9,FRONTZ+.3);scene.add(sideL);
const sideR=sideL.clone();sideR.position.x=1.45;scene.add(sideR);
const valTex=canvasTex(512,128,(x,w,h)=>{x.fillStyle='#7a1420';x.fillRect(0,0,w,h);for(let i=0;i<9;i++){x.fillStyle='#9a2030';x.beginPath();x.ellipse(w*(i+.5)/9,h*.62,w/18,h*.42,0,0,Math.PI);x.fill()}x.fillStyle='#c9a24a';x.fillRect(0,h*.12,w,6)});
const valance=mk(new THREE.PlaneGeometry(SW+2.4,.8),new THREE.MeshBasicMaterial({map:valTex}));valance.position.set(0,(ST.top||2.35)+.25,FRONTZ+.32);scene.add(valance);
const curtL=mk(new THREE.PlaneGeometry(SW/2+.3,3.6),matV),curtR=curtL.clone();curtL.position.z=curtR.position.z=FRONTZ+.25;scene.add(curtL,curtR);
const apron=mk(new THREE.BoxGeometry(SW+2.4,.22,.5),new THREE.MeshBasicMaterial({color:0x4a2e1c}));apron.position.set(0,-.118,FRONTZ+.12);scene.add(apron);
const floorMat=new THREE.MeshBasicMaterial({color:0xffffff});
const floor=mk(new THREE.PlaneGeometry(SW+1.6,FRONTZ-BACKZ),floorMat);floor.rotation.x=-Math.PI/2;floor.position.set(0,0,(FRONTZ+BACKZ)/2-.05);scene.add(floor);
const backMat=new THREE.MeshBasicMaterial({color:0xffffff});
const backdrop=mk(new THREE.PlaneGeometry(1,1),backMat);scene.add(backdrop);
const shadowTex=canvasTex(128,128,(x,w,h)=>{const g=x.createRadialGradient(64,64,4,64,64,62);g.addColorStop(0,'rgba(20,12,24,.55)');g.addColorStop(1,'rgba(20,12,24,0)');x.fillStyle=g;x.fillRect(0,0,w,h)});

// ---- 紙人形
const paperBackMat=(map)=>new THREE.MeshBasicMaterial({color:0xf3eee4,alphaMap:null,map:map,transparent:true,alphaTest:.3,side:THREE.BackSide});
function makePuppet(it){
  const g=new THREE.Group();const front=new THREE.MeshBasicMaterial({map:tex(it.tex),transparent:true,alphaTest:.06,side:THREE.FrontSide});
  const geo=new THREE.PlaneGeometry(1,1);geo.translate(0,.5,0);
  front.side=THREE.DoubleSide;const fm=mk(geo,front);const bmMat=new THREE.MeshBasicMaterial({map:tex(it.tex),color:0x000000,transparent:true,alphaTest:.06,side:THREE.BackSide});
  // 裏は白い紙：絵の形だけ借りて白で塗る
  bmMat.onBeforeCompile=s=>{s.fragmentShader=s.fragmentShader.replace('#include <map_fragment>','#include <map_fragment>\n diffuseColor.rgb=vec3(.95,.93,.88);')};
  const bm=mk(geo,bmMat);bm.visible=false;const pivot=new THREE.Group();pivot.add(fm);g.add(pivot);
  const sh=mk(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:shadowTex,transparent:true,depthWrite:false}));sh.rotation.x=-Math.PI/2;sh.position.y=.004;g.add(sh);
  return {g,pivot,front,bmMat,sh,it};
}
const pages=SPEC.pages.map((pg,pi)=>{
  const items=pg.items.map((it,k)=>{const p=makePuppet(it);p.k=k;p.g.visible=false;scene.add(p.g);return p});
  return {pg,items};
});
// 雨（紙の雨粒）
const dropT=SPEC.rain_tex?tex(SPEC.rain_tex):canvasTex(32,64,(x)=>{x.fillStyle='#a9c6e8';x.beginPath();x.moveTo(16,2);x.quadraticCurveTo(30,40,16,62);x.quadraticCurveTo(2,40,16,2);x.fill()});
const NR=140;const rainM=new THREE.InstancedMesh(new THREE.PlaneGeometry(.05,.12),new THREE.MeshBasicMaterial({map:dropT,transparent:true,opacity:.85,depthWrite:false}),NR);scene.add(rainM);
const rr=rng(7);const RD=[...Array(NR)].map(()=>({x:(rr()-.5)*(SW+.6),z:lerp(BACKZ+.3,FRONTZ-.2,rr()),ph:rr(),sp:2.2+rr()*.8}));
const dummy=new THREE.Object3D();

// ---- HUD
const hud=document.getElementById('hud');const NS='http://www.w3.org/2000/svg';
const el=(n,a,txt)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;hud.appendChild(e);return e};
const flash=el('rect',{x:0,y:0,width:540,height:960,fill:'#fff',opacity:0});
const title=el('text',{x:270,y:(SPEC.title_y||150),'text-anchor':'middle','font-size':34,'font-weight':900,fill:'#f6d47a',stroke:'#1a1016','stroke-width':6},SPEC.title);
const subs=[0,1,2].map(i=>el('text',{x:270,y:(SPEC.sub_y||300)+i*38,'text-anchor':'middle','font-size':27,'font-weight':700,fill:'#fff',stroke:'#140c12','stroke-width':6},''));

// ---- 1コマ
function itemState(p,t,pg){
  const it=p.it;let x=it.x,y=0,face=it.face||1,pose=it.tex,sx=1,sy=1,rz=0,vis=1,rx=0,flipK=null;
  // ポップアップ
  const pop=it.pop!==false;const t0=pg.t0+.15+p.k*.07;if(pop){const k=clamp((t-t0)/.55,0,1);rx=-(1-back(k))*Math.PI/2;if(t<t0)rx=-Math.PI/2}
  if(it.show!=null&&t<it.show){vis=0}else if(it.show!=null){const k=clamp((t-it.show)/.45,0,1);sy*=back(k);sx*=lerp(.6,1,k)}
  if(it.hide!=null&&t>it.hide){const k=clamp((t-it.hide)/.3,0,1);sx*=1-k;sy*=1-k;if(k>=1)vis=0}
  let rotY=face>0?0:Math.PI;
  for(const a of (it.acts||[])){
    if(a.do==='move'&&t>=a.t0){const k=ss(a.t0,a.t1,t);x=lerp(x,a.x,k)}
    if(a.do==='hop'&&t>=a.t0&&t<=a.t1){const u=(t-a.t0)/(a.t1-a.t0)*a.n,ph=u%1;y+=Math.sin(Math.PI*ph)*(a.h||.12);
      const land=Math.min(ph,1-ph);if(land<.12){const q=1-land/.12;sy*=1-.12*q;sx*=1+.1*q}else{sy*=1+.05;sx*=.97}}
    if(a.do==='flip'&&t>=a.t){const k=ss(a.t,a.t+.38,t);const target=a.face>0?0:Math.PI;const from=rotY;rotY=lerp(from,target+(target===from?0:0),k);if(a.pose&&k>=.5)pose=a.pose;face=a.face}
    if(a.do==='pose'&&t>=a.t){const k=clamp((t-a.t)/.34,0,1);const w=Math.sin(Math.PI*k);sx*=Math.max(.02,1-w);if(k>=.5)pose=a.pose}
    if(a.do==='shrink'&&t>=a.t){const k=clamp((t-a.t)/(a.dur||1.1),0,1);const e=k<.15?k/.15:Math.max(0,1-(k-.55)/.45);sy*=1-.16*e;sx*=1+.08*e;y-=0}
    if(a.do==='lift'&&t>=a.t0){y+=ss(a.t0,a.t1,t)*a.dy}
    if(a.do==='tilt'&&t>=a.t0){rz+=ss(a.t0,a.t1,t)*a.deg*Math.PI/180}
    if(a.do==='fall'&&t>=a.t0){const k=clamp((t-a.t0)/(a.t1-a.t0),0,1);y+=lerp(a.y0,a.y1,k*k);if(k>=1){const q=clamp((t-a.t1)/.25,0,1);sx*=1+q*.8;sy*=1-q;if(q>=1)vis=0}}
    if(a.do==='sway'){rz+=Math.sin((t-pg.t0)*(a.rate||2.2))*(a.deg||3)*Math.PI/180}
  }
  if(it.breath){sy*=1+.012*Math.sin(t*2.4+p.k)}
  return {x,y,sx,sy,rz,rx,rotY,pose,vis};
}
const sceneDim=new THREE.Color();
window.renderAt=function(t){
  // 今のページ（幕が閉じきった瞬間に替える）
  let cur=0;for(let i=0;i<SPEC.pages.length;i++){if(t>=SPEC.pages[i].t0-.01)cur=i}
  const P=SPEC.pages[cur];const prev=SPEC.pages[cur-1];
  // 幕：前のページの終わり t1 から閉じ、次の t0 で閉じきり、そこから開く
  let close=0;const nxt=SPEC.pages[cur+1];
  if(nxt&&t>P.t1)close=ss(P.t1,nxt.t0,t);
  if(t<P.t0+.7)close=Math.max(close,1-ss(P.t0,P.t0+.7,t));
  if(cur===0&&t<.05)close=1;
  const cw=SW/2+.3;curtL.position.x=lerp(-SW/2-cw/2-.4,-cw/2,close);curtR.position.x=-curtL.position.x;curtL.position.y=curtR.position.y=1.6;
  // 背景・床
  backMat.map=tex(P.bg);backMat.needsUpdate=true;const bh=P.bg_h||3.0;backdrop.scale.set(bh*(P.bg_aspect||1.333),bh,1);backdrop.position.set(0,bh/2+(P.bg_y||-.35),BACKZ);
  floorMat.color.set(P.floor||'#7f9a6a');
  let light=P.light!=null?P.light:1;if(P.light_to){light=lerp(light,P.light_to[1],ss(P.light_to[0],P.light_to[0]+1.5,t))}
  let fl=0;for(const th of (P.thunder||[])){const d=t-th;if(d>=0&&d<.5)fl=Math.max(fl,(d<.06?1:d<.12?.3:d<.18?.8:Math.max(0,1-(d-.18)/.32))*.55)}
  flash.setAttribute('opacity',fl.toFixed(3));
  sceneDim.setScalar(light);backMat.color.copy(sceneDim);floorMat.color.multiplyScalar(light);
  // 紙人形
  pages.forEach((pp,pi)=>pp.items.forEach(p=>{p.g.visible=false}));
  for(const p of pages[cur].items){const s=itemState(p,t,P);if(!s.vis)continue;p.g.visible=true;
    const it=p.it;const hgt=it.h,wid=hgt*it.aspect;p.pivot.scale.set(wid*s.sx,hgt*s.sy,1);p.pivot.position.set(0,s.y,0);
    p.pivot.rotation.set(s.rx,s.rotY,s.rz);p.g.position.set(s.x,0,it.z);
    if(p.front.map!==tex(s.pose)){p.front.map=tex(s.pose);p.bmMat.map=tex(s.pose);p.front.needsUpdate=p.bmMat.needsUpdate=true}
    p.front.color.copy(sceneDim);
    const shs=wid*.9*(1-Math.min(.5,s.y/1.2));p.sh.scale.set(shs,shs*.32,1);p.sh.material.opacity=Math.max(0,1-s.y)*(s.rx<-.8?0:1)*(it.shadow===false?0:1)}
  // 雨
  let rain=0;if(P.rain){rain=ss(P.rain[0],P.rain[0]+1,t)*(1-ss(P.rain[1]-1,P.rain[1],t))}
  for(let i=0;i<NR;i++){const d=RD[i];const on=i/NR<rain;const yy=2.6-((t*d.sp+d.ph*2.6)%2.6);dummy.position.set(d.x,on?yy:-9,d.z);dummy.updateMatrix();rainM.setMatrixAt(i,dummy.matrix)}rainM.instanceMatrix.needsUpdate=true;
  // カメラ：ゆっくり寄る・少し流れる
  const u=clamp((t-P.t0)/Math.max(.1,P.t1-P.t0),0,1);const cz=lerp(P.cam_z0||8.6,P.cam_z1||8.1,ss(0,1,u)),cx=lerp(P.cam_x0||-.08,P.cam_x1||.08,u);
  camera.position.set(cx,1.3,cz);camera.lookAt(cx*.6,P.look_y||1.42,0);
  // 字幕
  let lines=[];for(const L of P.lines){if(t>=L.t-.1&&t<=L.t+L.d+.35)lines=L.wrap}
  subs.forEach((s,i)=>{s.textContent=lines[i]||''});
  renderer.render(scene,camera);
};
// テクスチャを全部読み終えたら準備完了
const allTex=new Set();SPEC.pages.forEach(p=>{allTex.add(p.bg);p.items.forEach(it=>{allTex.add(it.tex);(it.acts||[]).forEach(a=>a.pose&&allTex.add(a.pose))})});
const pend=[...allTex].map(p=>new Promise(r=>{const t=tex(p);if(t.image&&t.image.complete)r();else{const im=new Image();im.onload=r;im.onerror=()=>{console.log('NG tex '+p);r()};im.src=p}}));
Promise.all(pend).then(()=>setTimeout(()=>{window.__fig={ok:1};window.__ready=true},400));
</script></body></html>
