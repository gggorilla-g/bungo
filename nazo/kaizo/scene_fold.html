    paper.scale.set(Math.max(lerp(a[0],b[0],f),wmin),Math.max(h,.0001),Math.max(lerp(a[1],b[1],f),wmin*.8));
    const px=v=>v/Vh*960;   // 高さ v が画面で何px か
    const lab=(p,txt,v,o)=>{const s=px(v);const op=sstep(26,60,s)*(1-sstep(520,700,s));if(op>.02)labels.push(Object.assign({p,t:txt,op},o||{}))};
    lab([1.05,1.6,.15],'人形 1.6m',1.6,{dx:-10,dy:-22,a:'end'});
    lab([-20,15,-40],'校舎 約15m',15,{dx:-10,dy:-18,a:'end'});
    lab([TOWER[0],333,TOWER[1]],fmtRef(R.tokyo_tower),333,{dx:16,dy:52});
    lab([FUJI[0],R.fuji.value,FUJI[1]],fmtRef(R.fuji)+'（高さの比較）',R.fuji.value,{dx:-12,dy:-18,a:'end'});
    renderer.render(ground,gcam);cam=gcam;place=h<1.2?'机の上':(h<60?'校庭':'東京の上空')}
  else{// 地球と月（大きさは見やすく拡大。最小でも画面に対して一定の大きさ）
    const re=Math.max(RE,.08*Vh),rm=Math.max(RM,.035*Vh),B=U.clone().multiplyScalar(re);
    earth.scale.setScalar(re);atm.scale.setScalar(re*(1+Math.max(.012,60000/re)));
    moon.scale.setScalar(rm);moon.position.copy(B).addScaledVector(U,DM-RE).addScaledVector(SIDE,-(rm*1.35+.02*Vh));
    spaper.position.copy(B);const w=.012*Vh;spaper.scale.set(w,h,w);
    const tgt=B.clone().addScaledVector(U,Vh*(SBASE-480)/960);
    scam.up.copy(U);scam.position.copy(tgt).addScaledVector(SIDE,d).addScaledVector(U,d*.03);scam.near=Math.max(1,d*.01);scam.far=1e11;scam.updateProjectionMatrix();scam.lookAt(tgt);scam.updateMatrixWorld();
    ssun.position.copy(tgt).addScaledVector(SIDE,1).addScaledVector(U,.6).addScaledVector(new THREE.Vector3().crossVectors(U,SIDE),.5);ssun.target.position.copy(tgt);
    const px=v=>v/Vh*960,lab=(v,txt,o)=>{const s=px(v);const op=sstep(22,50,s);if(op>.02){const p=B.clone().addScaledVector(U,v);labels.push(Object.assign({p:[p.x,p.y,p.z],t:txt,op},o||{}))}};
    lab(R.karman.valueM,fmtRef(R.karman),{dx:-16,dy:-6,a:'end'});lab(R.geo.valueM,fmtRef(R.geo),{dx:-16,dy:-6,a:'end'});
    renderer.render(space,scam);cam=scam;place='宇宙'}
  const ho=1-hop;labels.forEach(l=>l.op=(l.op==null?1:l.op)*ho);drawHud(t,n,place,labels,cam);return{n,h,Vh}};
window.__info={keys:SPEC.timeline.keys};
const FONTS=Promise.all([400,700,900].map(w=>document.fonts.load(w+' 20px JumpSans','あ0'))).then(r=>{if(r.some(x=>!x.length))throw new Error('書体が読めない')});
const IMG=new Promise((ok,ng)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>ng(new Error('陸地の画像が読めない'));i.src='assets/land_4096.png'}).then(i=>{earthMat.map=earthTexture(i);earthMat.needsUpdate=true});
Promise.all([FONTS,IMG]).then(()=>{window.__fig={kind:'none'};window.__ready=true},e=>{console.log('load error: '+e.message)});
</script></body></html>
